<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>🍓 Ягодка — мессенджер</title>
  <style>
    /* ---------- Базовые стили ---------- */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', Roboto, system-ui, sans-serif;
    }

    :root {
      --bg-body: #fce4ec;
      --bg-app: rgba(255, 245, 247, 0.92);
      --bg-sidebar: rgba(255, 240, 245, 0.3);
      --bg-chat: rgba(255, 245, 247, 0.5);
      --bg-right: rgba(255, 240, 245, 0.2);
      --bg-input: white;
      --bg-message: white;
      --bg-message-own: linear-gradient(135deg, #f06292, #ec407a);
      --bg-message-own-text: white;
      --text-primary: #2a0a1a;
      --text-secondary: #7a4a5a;
      --text-light: #9a6a7a;
      --border-color: rgba(255, 255, 255, 0.3);
      --shadow-color: rgba(180, 60, 80, 0.25);
      --message-shadow: rgba(0, 0, 0, 0.04);
      --header-bg: linear-gradient(135deg, #d81b60, #ad1457);
      --header-text: white;
      --input-bg: white;
      --input-text: #1a1a1a;
      --sticker-bg: rgba(255, 255, 255, 0.7);
      --sticker-hover: rgba(255, 255, 255, 0.95);
      --profile-field-bg: rgba(255, 255, 255, 0.7);
      --date-divider-bg: rgba(255, 255, 255, 0.6);
      --scrollbar-thumb: #f06292;
      --chat-item-bg: rgba(255, 255, 255, 0.6);
      --chat-item-hover: rgba(255, 255, 255, 0.9);
      --chat-item-active: rgba(216, 27, 96, 0.12);
      --reply-bg: rgba(216, 27, 96, 0.08);
      --reply-border: #d81b60;
      --context-menu-bg: white;
      --context-menu-text: #2a0a1a;
      --context-menu-hover: #fce4ec;
    }

    /* Тёмная тема */
    [data-theme="dark"] {
      --bg-body: #1a0a12;
      --bg-app: rgba(30, 15, 22, 0.95);
      --bg-sidebar: rgba(40, 20, 30, 0.4);
      --bg-chat: rgba(30, 15, 22, 0.6);
      --bg-right: rgba(40, 20, 30, 0.3);
      --bg-input: #2a1a22;
      --bg-message: #2a1a22;
      --bg-message-own: linear-gradient(135deg, #ad1457, #880e4f);
      --bg-message-own-text: #fce4ec;
      --text-primary: #f5e4ec;
      --text-secondary: #b08a9a;
      --text-light: #8a6a7a;
      --border-color: rgba(255, 255, 255, 0.08);
      --shadow-color: rgba(0, 0, 0, 0.5);
      --message-shadow: rgba(0, 0, 0, 0.2);
      --header-bg: linear-gradient(135deg, #880e4f, #4a0a2a);
      --header-text: #f5e4ec;
      --input-bg: #2a1a22;
      --input-text: #f5e4ec;
      --sticker-bg: rgba(40, 20, 30, 0.7);
      --sticker-hover: rgba(60, 30, 45, 0.9);
      --profile-field-bg: rgba(40, 20, 30, 0.7);
      --date-divider-bg: rgba(40, 20, 30, 0.6);
      --scrollbar-thumb: #ad1457;
      --chat-item-bg: rgba(40, 20, 30, 0.6);
      --chat-item-hover: rgba(60, 30, 45, 0.8);
      --chat-item-active: rgba(216, 27, 96, 0.2);
      --reply-bg: rgba(216, 27, 96, 0.15);
      --reply-border: #ad1457;
      --context-menu-bg: #2a1a22;
      --context-menu-text: #f5e4ec;
      --context-menu-hover: #3a2a32;
    }

    body {
      background: var(--bg-body);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 24px;
      transition: background 0.3s;
    }

    .app-container {
      max-width: 1100px;
      width: 100%;
      height: 90vh;
      max-height: 800px;
      background: var(--bg-app);
      backdrop-filter: blur(8px);
      border-radius: 32px;
      box-shadow: 0 20px 60px var(--shadow-color);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      border: 2px solid var(--border-color);
      position: relative;
      transition: background 0.3s, border-color 0.3s;
    }

    /* ----- Шапка ----- */
    .app-header {
      background: var(--header-bg);
      padding: 14px 24px;
      color: var(--header-text);
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 3px solid #f06292;
      flex-shrink: 0;
      transition: background 0.3s;
    }

    .app-header h1 {
      font-size: 24px;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .app-header h1 span {
      font-size: 28px;
    }

    .header-actions {
      display: flex;
      gap: 12px;
      align-items: center;
    }

    .header-actions button {
      background: rgba(255, 255, 255, 0.2);
      border: none;
      color: var(--header-text);
      padding: 7px 16px;
      border-radius: 24px;
      font-size: 14px;
      cursor: pointer;
      transition: 0.2s;
      backdrop-filter: blur(4px);
      font-weight: 500;
    }

    .header-actions button:hover {
      background: rgba(255, 255, 255, 0.35);
      transform: scale(1.02);
    }

    .theme-toggle {
      font-size: 20px;
      padding: 6px 12px !important;
    }

    .header-actions .badge {
      background: #ff6b6b;
      color: white;
      border-radius: 50%;
      padding: 2px 9px;
      font-size: 12px;
      font-weight: 700;
      margin-left: 6px;
    }

    /* ----- Основное содержимое ----- */
    .main-content {
      flex: 1;
      display: flex;
      overflow: hidden;
      position: relative;
    }

    /* ----- Левая панель: Чаты ----- */
    .sidebar {
      width: 300px;
      min-width: 250px;
      background: var(--bg-sidebar);
      border-right: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
      transition: background 0.3s, border-color 0.3s;
    }

    .sidebar-header {
      padding: 14px 18px 10px;
      font-weight: 700;
      font-size: 17px;
      color: var(--text-primary);
      border-bottom: 1px solid var(--border-color);
      display: flex;
      justify-content: space-between;
      align-items: center;
      transition: color 0.3s, border-color 0.3s;
    }

    .sidebar-header .new-chat-btn {
      background: linear-gradient(135deg, #d81b60, #ad1457);
      border: none;
      color: white;
      padding: 5px 14px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: 0.2s;
    }

    .sidebar-header .new-chat-btn:hover {
      transform: scale(1.05);
    }

    .chat-list {
      flex: 1;
      overflow-y: auto;
      padding: 6px 10px;
    }

    .chat-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 14px;
      background: var(--chat-item-bg);
      border-radius: 14px;
      margin-bottom: 5px;
      cursor: pointer;
      transition: 0.2s;
      border: 1px solid var(--border-color);
      backdrop-filter: blur(4px);
    }

    .chat-item:hover {
      background: var(--chat-item-hover);
      transform: translateX(4px);
      box-shadow: 0 4px 12px rgba(180, 60, 80, 0.08);
    }

    .chat-item.active {
      background: var(--chat-item-active);
      border-color: #d81b60;
    }

    .chat-item .chat-avatar {
      width: 46px;
      height: 46px;
      border-radius: 50%;
      background: linear-gradient(135deg, #f06292, #ec407a);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      color: white;
      flex-shrink: 0;
    }

    .chat-item .chat-info {
      flex: 1;
      min-width: 0;
    }

    .chat-item .chat-name {
      font-weight: 600;
      color: var(--text-primary);
      font-size: 15px;
      transition: color 0.3s;
    }

    .chat-item .chat-last-msg {
      font-size: 13px;
      color: var(--text-secondary);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      transition: color 0.3s;
    }

    .chat-item .chat-meta {
      text-align: right;
      flex-shrink: 0;
    }

    .chat-item .chat-time {
      font-size: 11px;
      color: var(--text-light);
      transition: color 0.3s;
    }

    .chat-item .chat-unread {
      background: #d81b60;
      color: white;
      border-radius: 50%;
      padding: 2px 9px;
      font-size: 12px;
      font-weight: 700;
      margin-top: 4px;
      display: inline-block;
      min-width: 22px;
      text-align: center;
    }

    /* ----- Центральная панель: Чат ----- */
    .chat-panel {
      flex: 1;
      display: flex;
      flex-direction: column;
      background: var(--bg-chat);
      min-width: 0;
      transition: background 0.3s;
    }

    .chat-panel-empty {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: var(--text-secondary);
      padding: 40px;
    }

    .chat-panel-empty .big-icon {
      font-size: 72px;
      margin-bottom: 16px;
    }

    .chat-panel-empty h2 {
      font-size: 24px;
      margin-bottom: 8px;
      color: var(--text-primary);
    }

    .chat-panel-empty p {
      opacity: 0.7;
    }

    .chat-panel-header {
      padding: 14px 22px;
      background: var(--bg-sidebar);
      border-bottom: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      gap: 12px;
      flex-shrink: 0;
      transition: background 0.3s, border-color 0.3s;
    }

    .chat-panel-header .chat-title {
      font-size: 19px;
      font-weight: 700;
      color: var(--text-primary);
      transition: color 0.3s;
    }

    .chat-panel-header .chat-status {
      font-size: 13px;
      color: var(--text-secondary);
      transition: color 0.3s;
    }

    .chat-panel-header .chat-avatar-small {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      background: linear-gradient(135deg, #f06292, #ec407a);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      color: white;
      flex-shrink: 0;
    }

    .messages-area {
      flex: 1;
      padding: 16px 22px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    .input-area {
      padding: 14px 22px 18px;
      background: var(--bg-sidebar);
      backdrop-filter: blur(4px);
      border-top: 1px solid var(--border-color);
      display: flex;
      gap: 10px;
      align-items: center;
      flex-shrink: 0;
      transition: background 0.3s, border-color 0.3s;
    }

    .input-area input[type="text"] {
      flex: 1;
      padding: 11px 18px;
      border: none;
      border-radius: 28px;
      background: var(--input-bg);
      font-size: 15px;
      outline: 2px solid transparent;
      transition: 0.2s, background 0.3s, color 0.3s;
      color: var(--input-text);
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
    }

    .input-area input[type="text"]:focus {
      outline: 2px solid #ec407a;
      box-shadow: 0 4px 16px rgba(216, 27, 96, 0.1);
    }

    .input-area input[type="text"]::placeholder {
      color: var(--text-light);
    }

    .input-area button {
      background: linear-gradient(135deg, #d81b60, #ad1457);
      border: none;
      color: white;
      padding: 11px 24px;
      border-radius: 28px;
      font-weight: 600;
      font-size: 15px;
      cursor: pointer;
      transition: 0.2s;
      box-shadow: 0 4px 16px rgba(216, 27, 96, 0.2);
      white-space: nowrap;
    }

    .input-area button:hover {
      transform: scale(1.03);
      box-shadow: 0 6px 24px rgba(216, 27, 96, 0.3);
    }

    .input-area button:active {
      transform: scale(0.96);
    }

    .input-area .sticker-btn {
      background: rgba(216, 27, 96, 0.1);
      color: #d81b60;
      padding: 11px 14px;
      font-size: 22px;
      box-shadow: none;
      min-width: 48px;
    }

    .input-area .sticker-btn:hover {
      background: rgba(216, 27, 96, 0.2);
      transform: scale(1.05);
    }

    /* Reply-бар в поле ввода */
    .reply-bar {
      display: none;
      padding: 8px 14px;
      background: var(--reply-bg);
      border-left: 4px solid var(--reply-border);
      border-radius: 8px;
      margin: 0 22px 0 22px;
      font-size: 13px;
      color: var(--text-secondary);
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
      transition: background 0.3s, border-color 0.3s, color 0.3s;
    }

    .reply-bar.active {
      display: flex;
    }

    .reply-bar .reply-content {
      flex: 1;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .reply-bar .reply-content strong {
      color: var(--text-primary);
    }

    .reply-bar .reply-close {
      background: none;
      border: none;
      color: var(--text-secondary);
      font-size: 18px;
      cursor: pointer;
      padding: 0 6px;
    }

    .reply-bar .reply-close:hover {
      color: var(--text-primary);
    }

    /* ----- Правая панель ----- */
    .right-panel {
      width: 300px;
      min-width: 250px;
      background: var(--bg-right);
      border-left: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
      overflow: hidden;
      transition: background 0.3s, border-color 0.3s;
    }

    .right-panel-tabs {
      display: flex;
      border-bottom: 1px solid var(--border-color);
      flex-shrink: 0;
    }

    .right-panel-tabs button {
      flex: 1;
      padding: 12px 0;
      border: none;
      background: transparent;
      font-size: 14px;
      font-weight: 600;
      color: var(--text-secondary);
      cursor: pointer;
      transition: 0.2s;
      border-bottom: 3px solid transparent;
    }

    .right-panel-tabs button.active {
      color: #d81b60;
      border-bottom-color: #d81b60;
      background: rgba(216, 27, 96, 0.05);
    }

    .right-panel-tabs button:hover {
      background: rgba(216, 27, 96, 0.05);
    }

    .right-panel-content {
      flex: 1;
      overflow-y: auto;
      padding: 14px;
    }

    .right-tab {
      display: none;
    }

    .right-tab.active {
      display: block;
    }

    /* ----- Стикеры ----- */
    .stickers-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
    }

    .sticker-item {
      aspect-ratio: 1;
      background: var(--sticker-bg);
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 34px;
      cursor: pointer;
      transition: 0.2s;
      border: 2px solid transparent;
      backdrop-filter: blur(4px);
    }

    .sticker-item:hover {
      transform: scale(1.1);
      border-color: #d81b60;
      background: var(--sticker-hover);
      box-shadow: 0 4px 16px rgba(216, 27, 96, 0.15);
    }

    .sticker-item:active {
      transform: scale(0.92);
    }

    .sticker-category {
      font-size: 14px;
      font-weight: 600;
      color: var(--text-primary);
      margin: 14px 0 8px;
      padding-left: 4px;
      transition: color 0.3s;
    }

    /* ----- Профиль ----- */
    .profile-content {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 4px 0;
    }

    .profile-avatar {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      background: linear-gradient(135deg, #f06292, #ec407a);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 36px;
      color: white;
      margin-bottom: 10px;
      box-shadow: 0 8px 24px rgba(216, 27, 96, 0.2);
      border: 4px solid var(--bg-app);
    }

    .profile-name {
      font-size: 20px;
      font-weight: 700;
      color: var(--text-primary);
      margin-bottom: 2px;
      transition: color 0.3s;
    }

    .profile-status {
      color: var(--text-secondary);
      font-size: 14px;
      margin-bottom: 16px;
      transition: color 0.3s;
    }

    .profile-field {
      width: 100%;
      padding: 10px 14px;
      background: var(--profile-field-bg);
      border-radius: 10px;
      margin-bottom: 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border: 1px solid var(--border-color);
      transition: background 0.3s, border-color 0.3s;
    }

    .profile-field .label {
      color: var(--text-secondary);
      font-size: 13px;
      transition: color 0.3s;
    }

    .profile-field .value {
      font-weight: 600;
      color: var(--text-primary);
      transition: color 0.3s;
    }

    .profile-field input {
      border: none;
      background: transparent;
      font-weight: 600;
      color: var(--text-primary);
      font-size: 14px;
      text-align: right;
      outline: none;
      width: 140px;
      transition: color 0.3s;
    }

    .profile-field input::placeholder {
      color: var(--text-light);
    }

    .profile-stats {
      display: flex;
      gap: 24px;
      margin: 10px 0 14px;
      width: 100%;
      justify-content: center;
    }

    .profile-stats .stat {
      text-align: center;
    }

    .profile-stats .stat .num {
      font-size: 20px;
      font-weight: 700;
      color: #d81b60;
    }

    .profile-stats .stat .label {
      font-size: 12px;
      color: var(--text-secondary);
      transition: color 0.3s;
    }

    .profile-btn {
      background: linear-gradient(135deg, #d81b60, #ad1457);
      border: none;
      color: white;
      padding: 10px 24px;
      border-radius: 28px;
      font-weight: 600;
      font-size: 15px;
      cursor: pointer;
      transition: 0.2s;
      box-shadow: 0 4px 12px rgba(216, 27, 96, 0.3);
      width: 100%;
      margin-top: 4px;
    }

    .profile-btn:hover {
      transform: scale(1.02);
      box-shadow: 0 6px 20px rgba(216, 27, 96, 0.4);
    }

    .profile-btn-outline {
      background: transparent;
      border: 2px solid #d81b60;
      color: #d81b60;
      padding: 9px 18px;
      border-radius: 28px;
      font-weight: 600;
      font-size: 14px;
      cursor: pointer;
      transition: 0.2s;
      margin-top: 6px;
      width: 100%;
      text-align: center;
    }

    .profile-btn-outline:hover {
      background: #d81b60;
      color: white;
    }

    /* ----- Сообщения ----- */
    .message {
      max-width: 70%;
      padding: 9px 16px;
      border-radius: 20px 20px 20px 6px;
      background: var(--bg-message);
      box-shadow: 0 2px 8px var(--message-shadow);
      align-self: flex-start;
      word-break: break-word;
      border: 1px solid var(--border-color);
      animation: fadeUp 0.25s ease;
      margin-bottom: 2px;
      cursor: pointer;
      transition: background 0.3s, border-color 0.3s, box-shadow 0.3s;
      position: relative;
    }

    .message:hover {
      box-shadow: 0 4px 16px rgba(216, 27, 96, 0.1);
    }

    .message.own {
      align-self: flex-end;
      background: var(--bg-message-own);
      color: var(--bg-message-own-text);
      border-radius: 20px 20px 6px 20px;
      border-color: transparent;
    }

    .message .msg-user {
      font-weight: 600;
      font-size: 13px;
      color: #880e4f;
      margin-bottom: 2px;
      display: flex;
      justify-content: space-between;
      gap: 12px;
    }

    .message.own .msg-user {
      color: #fce4ec;
    }

    .message .msg-time {
      font-size: 10px;
      opacity: 0.7;
      font-weight: 400;
    }

    .message .msg-text {
      font-size: 15px;
      line-height: 1.45;
    }

    .message .sticker-emoji {
      font-size: 48px;
      display: block;
      text-align: center;
      padding: 4px 0;
      line-height: 1.2;
    }

    /* Reply в сообщении */
    .message .msg-reply {
      font-size: 13px;
      padding: 6px 10px;
      background: var(--reply-bg);
      border-left: 3px solid var(--reply-border);
      border-radius: 6px;
      margin-bottom: 6px;
      color: var(--text-secondary);
      transition: background 0.3s, border-color 0.3s, color 0.3s;
    }

    .message .msg-reply .reply-author {
      font-weight: 600;
      color: var(--text-primary);
    }

    /* Контекстное меню */
    .context-menu {
      display: none;
      position: fixed;
      background: var(--context-menu-bg);
      border-radius: 12px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
      padding: 6px 0;
      z-index: 1000;
      min-width: 180px;
      border: 1px solid var(--border-color);
    }

    .context-menu.active {
      display: block;
    }

    .context-menu-item {
      padding: 10px 18px;
      color: var(--context-menu-text);
      cursor: pointer;
      transition: 0.15s;
      font-size: 14px;
      display: flex;
      align-items: center;
      gap: 10px;
      border: none;
      background: none;
      width: 100%;
      text-align: left;
    }

    .context-menu-item:hover {
      background: var(--context-menu-hover);
    }

    .context-menu-item.danger {
      color: #d81b60;
    }

    .context-menu-item.danger:hover {
      background: #fce4ec;
    }

    /* Редактирование сообщения */
    .message.editing {
      outline: 2px solid #d81b60;
      outline-offset: 2px;
    }

    .edit-input-area {
      display: none;
      padding: 12px 22px 18px;
      background: var(--bg-sidebar);
      border-top: 1px solid var(--border-color);
      gap: 10px;
      align-items: center;
      flex-shrink: 0;
      transition: background 0.3s, border-color 0.3s;
    }

    .edit-input-area.active {
      display: flex;
    }

    .edit-input-area input {
      flex: 1;
      padding: 10px 16px;
      border: none;
      border-radius: 24px;
      background: var(--input-bg);
      font-size: 15px;
      outline: 2px solid #d81b60;
      color: var(--input-text);
    }

    .edit-input-area button {
      background: linear-gradient(135deg, #d81b60, #ad1457);
      border: none;
      color: white;
      padding: 10px 20px;
      border-radius: 24px;
      font-weight: 600;
      cursor: pointer;
      transition: 0.2s;
    }

    .edit-input-area button:hover {
      transform: scale(1.03);
    }

    .edit-input-area .cancel-edit {
      background: transparent;
      color: var(--text-secondary);
      box-shadow: none;
    }

    .edit-input-area .cancel-edit:hover {
      background: var(--border-color);
    }

    /* Дата разделитель */
    .date-divider {
      text-align: center;
      font-size: 12px;
      color: var(--text-secondary);
      padding: 10px 0 6px;
      transition: color 0.3s;
    }

    .date-divider span {
      background: var(--date-divider-bg);
      padding: 4px 18px;
      border-radius: 20px;
      font-weight: 500;
      transition: background 0.3s;
    }

    /* Анимация */
    @keyframes fadeUp {
      0% { opacity: 0; transform: translateY(10px); }
      100% { opacity: 1; transform: translateY(0); }
    }

    /* Скролл */
    .chat-list::-webkit-scrollbar,
    .messages-area::-webkit-scrollbar,
    .right-panel-content::-webkit-scrollbar {
      width: 5px;
    }

    .chat-list::-webkit-scrollbar-thumb,
    .messages-area::-webkit-scrollbar-thumb,
    .right-panel-content::-webkit-scrollbar-thumb {
      background: var(--scrollbar-thumb);
      border-radius: 10px;
    }

    .chat-list::-webkit-scrollbar-track,
    .messages-area::-webkit-scrollbar-track,
    .right-panel-content::-webkit-scrollbar-track {
      background: transparent;
    }

    /* ----- Адаптив для ПК ----- */
    @media (max-width: 900px) {
      .sidebar { width: 240px; min-width: 200px; }
      .right-panel { width: 240px; min-width: 200px; }
      .stickers-grid { grid-template-columns: repeat(3, 1fr); }
    }

    @media (max-width: 700px) {
      body { padding: 8px; }
      .app-container { height: 98vh; max-height: none; border-radius: 16px; }
      .sidebar { width: 180px; min-width: 140px; }
      .right-panel { width: 180px; min-width: 140px; }
      .stickers-grid { grid-template-columns: repeat(3, 1fr); }
      .chat-item { padding: 8px 10px; }
      .chat-item .chat-avatar { width: 34px; height: 34px; font-size: 14px; }
      .message { max-width: 85%; }
    }
  </style>
</head>
<body>

<div class="app-container">
  <!-- Шапка -->
  <div class="app-header">
    <h1><span>🍓</span> Ягодка</h1>
    <div class="header-actions">
      <button class="theme-toggle" id="themeToggle" title="Переключить тему">🌙</button>
      <button id="clearAllBtn">🗑️ Очистить всё</button>
      <span id="unreadBadge" class="badge" style="display:none;">0</span>
    </div>
  </div>

  <!-- Основное содержимое (3 колонки) -->
  <div class="main-content">
    <!-- Левая панель: Чаты -->
    <div class="sidebar">
      <div class="sidebar-header">
        <span>💬 Чаты</span>
        <button class="new-chat-btn" id="newChatBtn">+ Новый</button>
      </div>
      <div class="chat-list" id="chatList"></div>
    </div>

    <!-- Центральная панель: Чат -->
    <div class="chat-panel" id="chatPanel">
      <div class="chat-panel-empty" id="emptyState">
        <div class="big-icon">🍓</div>
        <h2>Добро пожаловать!</h2>
        <p>Выберите чат слева или создайте новый</p>
      </div>
      <div id="chatActive" style="display:none;flex-direction:column;height:100%;">
        <div class="chat-panel-header">
          <div class="chat-avatar-small" id="panelAvatar">🍓</div>
          <div>
            <div class="chat-title" id="panelTitle">Чат</div>
            <div class="chat-status" id="panelStatus">онлайн</div>
          </div>
        </div>
        <div class="messages-area" id="messagesArea"></div>
        <div class="reply-bar" id="replyBar">
          <div class="reply-content" id="replyContent">Ответ на: <strong>...</strong></div>
          <button class="reply-close" id="replyClose">✕</button>
        </div>
        <div class="input-area">
          <button class="sticker-btn" id="openStickersBtn">😊</button>
          <input type="text" id="chatInput" placeholder="Напишите сообщение..." maxlength="300" />
          <button id="chatSendBtn">🍒 Отправить</button>
        </div>
        <div class="edit-input-area" id="editArea">
          <input type="text" id="editInput" placeholder="Редактировать сообщение..." maxlength="300" />
          <button id="editSaveBtn">💾 Сохранить</button>
          <button class="cancel-edit" id="editCancelBtn">Отмена</button>
        </div>
      </div>
    </div>

    <!-- Правая панель: Стикеры + Профиль -->
    <div class="right-panel">
      <div class="right-panel-tabs">
        <button class="active" data-rtab="stickers">😊 Стикеры</button>
        <button data-rtab="profile">👤 Профиль</button>
      </div>
      <div class="right-panel-content">
        <div class="right-tab active" id="rtab-stickers">
          <div class="sticker-category">🍓 Ягодные</div>
          <div class="stickers-grid" id="stickerGrid1"></div>
          <div class="sticker-category">😊 Смайлы</div>
          <div class="stickers-grid" id="stickerGrid2"></div>
          <div class="sticker-category">❤️ Сердечки</div>
          <div class="stickers-grid" id="stickerGrid3"></div>
          <div class="sticker-category">🎉 Праздничные</div>
          <div class="stickers-grid" id="stickerGrid4"></div>
        </div>
        <div class="right-tab" id="rtab-profile">
          <div class="profile-content">
            <div class="profile-avatar">🍓</div>
            <div class="profile-name" id="profileName">Я</div>
            <div class="profile-status">🍒 Онлайн</div>
            <div class="profile-stats">
              <div class="stat"><div class="num" id="statMessages">0</div><div class="label">Сообщений</div></div>
              <div class="stat"><div class="num" id="statChats">0</div><div class="label">Чатов</div></div>
              <div class="stat"><div class="num" id="statStickers">0</div><div class="label">Стикеров</div></div>
            </div>
            <div class="profile-field">
              <span class="label">👤 Имя</span>
              <input type="text" id="profileUsername" placeholder="Ваше имя" maxlength="20" />
            </div>
            <div class="profile-field">
              <span class="label">🆔 ID</span>
              <span class="value" id="profileId">#yagodka-user</span>
            </div>
            <button class="profile-btn" id="profileSaveBtn">💾 Сохранить</button>
            <button class="profile-btn-outline" id="profileExportBtn">📤 Экспорт истории</button>
            <button class="profile-btn-outline" id="profileImportBtn">📥 Импорт истории</button>
            <input type="file" id="importFileInput" accept=".json" style="display:none;" />
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Контекстное меню -->
  <div class="context-menu" id="contextMenu">
    <button class="context-menu-item" data-action="reply">💬 Ответить</button>
    <button class="context-menu-item" data-action="edit">✏️ Редактировать</button>
    <button class="context-menu-item danger" data-action="delete">🗑️ Удалить</button>
  </div>
</div>

<script>
  (function() {
    // ----- Данные -----
    const STORAGE_KEY = 'yagodka_data';
    const USER_KEY = 'yagodka_username';
    const THEME_KEY = 'yagodka_theme';

    const STICKERS = {
      'Ягодные': ['🍓', '🍒', '🫐', '🍇', '🍉', '🍊', '🍋', '🍌', '🍑', '🍎', '🍏', '🍐'],
      'Смайлы': ['😊', '😂', '😍', '🤩', '😎', '🤗', '😇', '🥰', '😘', '🤪', '😜', '🤭'],
      'Сердечки': ['❤️', '🧡', '💛', '💚', '💙', '💜', '🖤', '🤍', '💕', '💗', '💖', '💘'],
      'Праздничные': ['🎉', '🎊', '🎈', '🎁', '🎀', '✨', '🌟', '⭐', '🔥', '💫', '🌈', '🎵']
    };

    // ----- Элементы -----
    const chatList = document.getElementById('chatList');
    const messagesArea = document.getElementById('messagesArea');
    const chatInput = document.getElementById('chatInput');
    const chatSendBtn = document.getElementById('chatSendBtn');
    const panelTitle = document.getElementById('panelTitle');
    const panelStatus = document.getElementById('panelStatus');
    const panelAvatar = document.getElementById('panelAvatar');
    const emptyState = document.getElementById('emptyState');
    const chatActive = document.getElementById('chatActive');
    const openStickersBtn = document.getElementById('openStickersBtn');
    const themeToggle = document.getElementById('themeToggle');

    const usernameInput = document.getElementById('profileUsername');
    const profileName = document.getElementById('profileName');
    const profileId = document.getElementById('profileId');
    const statMessages = document.getElementById('statMessages');
    const statChats = document.getElementById('statChats');
    const statStickers = document.getElementById('statStickers');
    const unreadBadge = document.getElementById('unreadBadge');
    const clearAllBtn = document.getElementById('clearAllBtn');
    const profileSaveBtn = document.getElementById('profileSaveBtn');
    const profileExportBtn = document.getElementById('profileExportBtn');
    const profileImportBtn = document.getElementById('profileImportBtn');
    const importFileInput = document.getElementById('importFileInput');
    const newChatBtn = document.getElementById('newChatBtn');

    const replyBar = document.getElementById('replyBar');
    const replyContent = document.getElementById('replyContent');
    const replyClose = document.getElementById('replyClose');

    const editArea = document.getElementById('editArea');
    const editInput = document.getElementById('editInput');
    const editSaveBtn = document.getElementById('editSaveBtn');
    const editCancelBtn = document.getElementById('editCancelBtn');

    const contextMenu = document.getElementById('contextMenu');

    const rightTabs = document.querySelectorAll('.right-panel-tabs button');
    const rightContents = {
      stickers: document.getElementById('rtab-stickers'),
      profile: document.getElementById('rtab-profile')
    };

    // ----- Состояние -----
    let currentUser = localStorage.getItem(USER_KEY) || 'Я';
    let currentChat = null;
    let replyTo = null; // { id, user, text }
    let editingMessage = null; // { id, chatName }
    let contextTarget = null; // { chatName, messageId, element }

    // ----- Тема -----
    function loadTheme() {
      const theme = localStorage.getItem(THEME_KEY) || 'light';
      document.documentElement.setAttribute('data-theme', theme);
      themeToggle.textContent = theme === 'dark' ? '☀️' : '🌙';
    }

    function toggleTheme() {
      const current = document.documentElement.getAttribute('data-theme');
      const next = current === 'dark' ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', next);
      localStorage.setItem(THEME_KEY, next);
      themeToggle.textContent = next === 'dark' ? '☀️' : '🌙';
    }

    themeToggle.addEventListener('click', toggleTheme);
    loadTheme();

    // ----- Работа с данными -----
    function loadData() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        return raw ? JSON.parse(raw) : { chats: {}, unread: {}, messageId: 0 };
      } catch {
        return { chats: {}, unread: {}, messageId: 0 };
      }
    }

    function saveData(data) {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
    }

    function getChatMessages(chatName) {
      const data = loadData();
      if (!data.chats[chatName]) {
        data.chats[chatName] = [];
      }
      return data.chats[chatName];
    }

    function saveChatMessages(chatName, messages) {
      const data = loadData();
      data.chats[chatName] = messages;
      saveData(data);
    }

    function getNextId() {
      const data = loadData();
      data.messageId = (data.messageId || 0) + 1;
      saveData(data);
      return data.messageId;
    }

    function markAsRead(chatName) {
      const data = loadData();
      if (data.unread && data.unread[chatName]) {
        delete data.unread[chatName];
        saveData(data);
        updateUI();
      }
    }

    function getUnreadCount(chatName) {
      const data = loadData();
      return (data.unread && data.unread[chatName]) || 0;
    }

    function incrementUnread(chatName) {
      const data = loadData();
      if (!data.unread) data.unread = {};
      data.unread[chatName] = (data.unread[chatName] || 0) + 1;
      saveData(data);
      updateUI();
    }

    // ----- Инициализация чатов -----
    function initDefaultChats() {
      const data = loadData();
      const defaultChats = ['🍓 Ягодка', '🌸 Цветочки', '🌿 Зелёный', '☀️ Солнышко'];
      let changed = false;

      defaultChats.forEach(name => {
        if (!data.chats[name]) {
          data.chats[name] = [];
          changed = true;
          const id = getNextId();
          data.chats[name].push({ 
            id: id,
            user: 'Ягодка', 
            text: '🍓 Добро пожаловать в Ягодку!', 
            timestamp: Date.now() - 60000,
            deleted: false
          });
        }
      });

      if (changed) saveData(data);
    }

    initDefaultChats();

    // ----- Форматирование -----
    function formatTime(timestamp) {
      if (!timestamp) return '';
      const date = new Date(timestamp);
      return date.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    }

    function formatDate(timestamp) {
      const date = new Date(timestamp);
      const now = new Date();
      const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
      const yesterday = new Date(today);
      yesterday.setDate(yesterday.getDate() - 1);

      const msgDate = new Date(date.getFullYear(), date.getMonth(), date.getDate());

      if (msgDate.getTime() === today.getTime()) return 'Сегодня';
      if (msgDate.getTime() === yesterday.getTime()) return 'Вчера';
      return date.toLocaleDateString('ru-RU', { day: 'numeric', month: 'long' });
    }

    function isEmoji(str) {
      if (!str || str.length > 4) return false;
      const emojiRegex = /^[\u{1F000}-\u{1FFFF}]|[\u2600-\u{27BF}]|[\u{FE00}-\u{FEFF}]|[\u{1F600}-\u{1F64F}]|[\u{1F300}-\u{1F5FF}]|[\u{1F680}-\u{1F6FF}]|[\u{1F700}-\u{1F77F}]|[\u{1F780}-\u{1F7FF}]|[\u{1F800}-\u{1F8FF}]|[\u{1F900}-\u{1F9FF}]|[\u{1FA00}-\u{1FA6F}]|[\u{1FA70}-\u{1FAFF}]|[\u{2700}-\u{27BF}]|[\u{2600}-\u{26FF}]|[\u{2300}-\u{23FF}]|[\u{1F1E0}-\u{1F1FF}]$/u;
      return emojiRegex.test(str);
    }

    function escapeHtml(str) {
      const div = document.createElement('div');
      div.textContent = str;
      return div.innerHTML;
    }

    // ----- Рендер списка чатов -----
    function renderChatList() {
      const data = loadData();
      const chatNames = Object.keys(data.chats);
      chatList.innerHTML = '';

      if (chatNames.length === 0) {
        chatList.innerHTML = `
          <div style="text-align:center;padding:30px 16px;color:var(--text-secondary);">
            <div style="font-size:40px;margin-bottom:8px;">🍓</div>
            <div style="font-weight:600;color:var(--text-primary);">Нет чатов</div>
            <div style="font-size:13px;opacity:0.7;">Создайте первый чат</div>
          </div>
        `;
        return;
      }

      chatNames.forEach(name => {
        const messages = data.chats[name] || [];
        const visibleMessages = messages.filter(m => !m.deleted);
        const lastMsg = visibleMessages[visibleMessages.length - 1];
        const unread = getUnreadCount(name);
        const isActive = name === currentChat;

        const div = document.createElement('div');
        div.className = `chat-item${isActive ? ' active' : ''}`;
        div.dataset.chat = name;

        const avatar = document.createElement('div');
        avatar.className = 'chat-avatar';
        avatar.textContent = name.charAt(0) || '💬';

        const info = document.createElement('div');
        info.className = 'chat-info';

        const nameSpan = document.createElement('div');
        nameSpan.className = 'chat-name';
        nameSpan.textContent = name;

        const lastMsgSpan = document.createElement('div');
        lastMsgSpan.className = 'chat-last-msg';
        if (lastMsg) {
          const text = lastMsg.text || '';
          const displayText = text.length > 30 ? text.slice(0, 30) + '...' : text;
          lastMsgSpan.textContent = lastMsg.deleted ? 'Сообщение удалено' : displayText;
        } else {
          lastMsgSpan.textContent = 'Нет сообщений';
        }

        info.appendChild(nameSpan);
        info.appendChild(lastMsgSpan);

        const meta = document.createElement('div');
        meta.className = 'chat-meta';

        const timeSpan = document.createElement('div');
        timeSpan.className = 'chat-time';
        timeSpan.textContent = lastMsg ? formatTime(lastMsg.timestamp) : '';

        meta.appendChild(timeSpan);

        if (unread > 0) {
          const badge = document.createElement('div');
          badge.className = 'chat-unread';
          badge.textContent = unread;
          meta.appendChild(badge);
        }

        div.appendChild(avatar);
        div.appendChild(info);
        div.appendChild(meta);

        div.addEventListener('click', () => openChat(name));

        chatList.appendChild(div);
      });

      updateUnreadBadge();
    }

    // ----- Открыть чат -----
    function openChat(chatName) {
      currentChat = chatName;
      markAsRead(chatName);
      replyTo = null;
      replyBar.classList.remove('active');
      editingMessage = null;
      editArea.classList.remove('active');

      emptyState.style.display = 'none';
      chatActive.style.display = 'flex';

      const data = loadData();
      const messages = data.chats[chatName] || [];

      panelTitle.textContent = chatName;
      panelStatus.textContent = 'онлайн';
      panelAvatar.textContent = chatName.charAt(0) || '🍓';

      renderMessages(chatName);
      chatInput.focus();
      updateUI();
    }

    // ----- Получить сообщение по ID -----
    function findMessage(chatName, messageId) {
      const messages = getChatMessages(chatName);
      return messages.find(m => m.id === messageId);
    }

    // ----- Рендер сообщений -----
    function renderMessages(chatName) {
      const messages = getChatMessages(chatName);
      const visibleMessages = messages.filter(m => !m.deleted);
      messagesArea.innerHTML = '';

      let lastDate = '';

      visibleMessages.forEach((msg) => {
        const msgDate = formatDate(msg.timestamp || Date.now());

        if (msgDate !== lastDate) {
          const divider = document.createElement('div');
          divider.className = 'date-divider';
          divider.innerHTML = `<span>${msgDate}</span>`;
          messagesArea.appendChild(divider);
          lastDate = msgDate;
        }

        const isOwn = msg.user === currentUser || (msg.user === 'Я');
        const div = document.createElement('div');
        div.className = `message ${isOwn ? 'own' : ''}`;
        div.dataset.messageId = msg.id;
        div.dataset.chat = chatName;

        // User + время
        const userSpan = document.createElement('div');
        userSpan.className = 'msg-user';
        userSpan.innerHTML = `
          <span>${escapeHtml(msg.user)}</span>
          <span class="msg-time">${formatTime(msg.timestamp)}</span>
        `;
        div.appendChild(userSpan);

        // Reply (если есть)
        if (msg.replyTo) {
          const replyDiv = document.createElement('div');
          replyDiv.className = 'msg-reply';
          const repliedMsg = findMessage(chatName, msg.replyTo);
          if (repliedMsg && !repliedMsg.deleted) {
            replyDiv.innerHTML = `
              <span class="reply-author">${escapeHtml(repliedMsg.user)}</span>: 
              ${escapeHtml(repliedMsg.text || '')}
            `;
          } else {
            replyDiv.textContent = 'Сообщение удалено';
          }
          div.appendChild(replyDiv);
        }

        // Текст
        const textSpan = document.createElement('div');
        textSpan.className = 'msg-text';

        if (msg.text && isEmoji(msg.text)) {
          textSpan.className = 'sticker-emoji';
          textSpan.textContent = msg.text;
        } else {
          textSpan.textContent = msg.text || '';
        }

        div.appendChild(textSpan);

        // Клик для контекстного меню
        div.addEventListener('click', (e) => {
          e.stopPropagation();
          showContextMenu(e, chatName, msg.id);
        });

        messagesArea.appendChild(div);
      });

      messagesArea.scrollTop = messagesArea.scrollHeight;
    }

    // ----- Контекстное меню -----
    function showContextMenu(e, chatName, messageId) {
      const msg = findMessage(chatName, messageId);
      if (!msg) return;

      const isOwn = msg.user === currentUser || (msg.user === 'Я');

      contextTarget = { chatName, messageId };

      // Показываем только доступные действия
      const items = contextMenu.querySelectorAll('.context-menu-item');
      items.forEach(item => {
        const action = item.dataset.action;
        if (action === 'edit' || action === 'delete') {
          item.style.display = isOwn ? 'flex' : 'none';
        } else {
          item.style.display = 'flex';
        }
      });

      contextMenu.style.left = Math.min(e.clientX, window.innerWidth - 200) + 'px';
      contextMenu.style.top = Math.min(e.clientY, window.innerHeight - 150) + 'px';
      contextMenu.classList.add('active');
    }

    // ----- Обработчики контекстного меню -----
    contextMenu.addEventListener('click', (e) => {
      const item = e.target.closest('.context-menu-item');
      if (!item) return;
      
      const action = item.dataset.action;
      if (!contextTarget) return;

      const { chatName, messageId } = contextTarget;
      const msg = findMessage(chatName, messageId);
      if (!msg) return;

      switch(action) {
        case 'reply':
          replyTo = { id: messageId, user: msg.user, text: msg.text };
          replyContent.innerHTML = `Ответ на: <strong>${escapeHtml(msg.user)}</strong>: ${escapeHtml(msg.text || '')}`;
          replyBar.classList.add('active');
          chatInput.focus();
          break;

        case 'edit':
          if (msg.user !== currentUser && msg.user !== 'Я') break;
          editingMessage = { id: messageId, chatName: chatName };
          editInput.value = msg.text || '';
          editArea.classList.add('active');
          editInput.focus();
          break;

        case 'delete':
          if (msg.user !== currentUser && msg.user !== 'Я') break;
          if (confirm('🗑️ Удалить это сообщение?')) {
            const messages = getChatMessages(chatName);
            const idx = messages.findIndex(m => m.id === messageId);
            if (idx !== -1) {
              messages[idx].deleted = true;
              saveChatMessages(chatName, messages);
              renderMessages(chatName);
              updateUI();
            }
          }
          break;
      }

      contextMenu.classList.remove('active');
      contextTarget = null;
    });

    // Закрываем контекстное меню по клику вне
    document.addEventListener('click', () => {
      contextMenu.classList.remove('active');
    });

    // ----- Отправка сообщения -----
    function sendMessageToChat(chatName) {
      const text = chatInput.value.trim();
      if (!text || !chatName) return;

      const messages = getChatMessages(chatName);
      const id = getNextId();
      const newMsg = {
        id: id,
        user: currentUser || 'Я',
        text: text,
        timestamp: Date.now(),
        deleted: false
      };

      if (replyTo) {
        newMsg.replyTo = replyTo.id;
        replyTo = null;
        replyBar.classList.remove('active');
      }

      messages.push(newMsg);
      saveChatMessages(chatName, messages);

      chatInput.value = '';
      renderMessages(chatName);
      updateUI();
      renderChatList();
    }

    // ----- Отправка стикера -----
    function sendSticker(chatName, sticker) {
      if (!chatName) {
        const data = loadData();
        const chatNames = Object.keys(data.chats);
        if (chatNames.length === 0) {
          alert('Сначала создайте чат!');
          return;
        }
        chatName = chatNames[0];
        openChat(chatName);
      }

      const messages = getChatMessages(chatName);
      const id = getNextId();
      messages.push({
        id: id,
        user: currentUser || 'Я',
        text: sticker,
        timestamp: Date.now(),
        deleted: false
      });
      saveChatMessages(chatName, messages);
      renderMessages(chatName);
      updateUI();
      renderChatList();

      if (currentChat !== chatName) {
        incrementUnread(chatName);
      }
    }

    // ----- Редактирование сообщения -----
    function saveEdit() {
      if (!editingMessage) return;
      const text = editInput.value.trim();
      if (!text) return;

      const { id, chatName } = editingMessage;
      const messages = getChatMessages(chatName);
      const msg = messages.find(m => m.id === id);
      if (msg) {
        msg.text = text;
        saveChatMessages(chatName, messages);
        renderMessages(chatName);
        updateUI();
      }

      editingMessage = null;
      editArea.classList.remove('active');
      editInput.value = '';
    }

    editSaveBtn.addEventListener('click', saveEdit);
    editCancelBtn.addEventListener('click', () => {
      editingMessage = null;
      editArea.classList.remove('active');
      editInput.value = '';
    });

    editInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        e.preventDefault();
        saveEdit();
      }
      if (e.key === 'Escape') {
        editCancelBtn.click();
      }
    });

    // ----- Reply -----
    replyClose.addEventListener('click', () => {
      replyTo = null;
      replyBar.classList.remove('active');
    });

    // ----- Рендер стикеров -----
    function renderStickers() {
      const gridIds = ['stickerGrid1', 'stickerGrid2', 'stickerGrid3', 'stickerGrid4'];
      const categories = Object.keys(STICKERS);

      categories.forEach((cat, idx) => {
        const grid = document.getElementById(gridIds[idx]);
        if (!grid) return;
        grid.innerHTML = '';
        STICKERS[cat].forEach(sticker => {
          const div = document.createElement('div');
          div.className = 'sticker-item';
          div.textContent = sticker;
          div.title = `Отправить ${sticker}`;
          div.addEventListener('click', () => {
            sendSticker(currentChat, sticker);
          });
          grid.appendChild(div);
        });
      });
    }

    // ----- Обновление UI -----
    function updateUI() {
      const data = loadData();
      const chatNames = Object.keys(data.chats);
      let totalMessages = 0;
      chatNames.forEach(name => {
        const msgs = data.chats[name] || [];
        totalMessages += msgs.filter(m => !m.deleted).length;
      });

      statMessages.textContent = totalMessages;
      statChats.textContent = chatNames.length;
      statStickers.textContent = Object.values(STICKERS).flat().length;

      profileName.textContent = currentUser;
      usernameInput.value = currentUser;
      profileId.textContent = '#yagodka-' + currentUser.toLowerCase().replace(/[^a-zа-я]/g, '');

      renderChatList();
      updateUnreadBadge();
    }

    function updateUnreadBadge() {
      const data = loadData();
      const unread = data.unread || {};
      const total = Object.values(unread).reduce((sum, val) => sum + val, 0);
      if (total > 0) {
        unreadBadge.style.display = 'inline';
        unreadBadge.textContent = total > 9 ? '9+' : total;
      } else {
        unreadBadge.style.display = 'none';
      }
    }

    // ----- Создание чата -----
    function createNewChat() {
      const name = prompt('🍓 Введите название нового чата:');
      if (!name || name.trim() === '') return;
      const chatName = name.trim();

      const data = loadData();
      if (data.chats[chatName]) {
        alert('Чат с таким именем уже существует!');
        return;
      }

      data.chats[chatName] = [];
      const id = getNextId();
      data.chats[chatName].push({
        id: id,
        user: 'Ягодка',
        text: `🍓 Добро пожаловать в чат "${chatName}"!`,
        timestamp: Date.now(),
        deleted: false
      });
      saveData(data);
      openChat(chatName);
      updateUI();
    }

    // ----- Очистка всех чатов -----
    function clearAllChats() {
      if (confirm('🧹 Очистить все чаты?')) {
        const data = loadData();
        const chatNames = Object.keys(data.chats);
        chatNames.forEach(name => {
          data.chats[name] = [];
        });
        data.unread = {};
        saveData(data);
        if (currentChat) {
          renderMessages(currentChat);
        }
        updateUI();
      }
    }

    // ----- Экспорт/Импорт -----
    function exportHistory() {
      const data = loadData();
      const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `yagodka_history_${new Date().toISOString().slice(0,10)}.json`;
      a.click();
      URL.revokeObjectURL(url);
    }

    function importHistory(file) {
      const reader = new FileReader();
      reader.onload = (e) => {
        try {
          const data = JSON.parse(e.target.result);
          if (data.chats && typeof data.chats === 'object') {
            saveData(data);
            if (currentChat) {
              renderMessages(currentChat);
            }
            updateUI();
            alert('✅ История успешно импортирована!');
          } else {
            alert('❌ Неверный формат файла');
          }
        } catch (err) {
          alert('❌ Ошибка при импорте: ' + err.message);
        }
      };
      reader.readAsText(file);
    }

    // ----- Переключение правой панели -----
    function switchRightTab(tabId) {
      rightTabs.forEach(btn => {
        btn.classList.toggle('active', btn.dataset.rtab === tabId);
      });
      Object.keys(rightContents).forEach(key => {
        rightContents[key].classList.toggle('active', key === tabId);
      });
    }

    rightTabs.forEach(btn => {
      btn.addEventListener('click', () => {
        switchRightTab(btn.dataset.rtab);
      });
    });

    // ----- Обработчики -----
    chatSendBtn.addEventListener('click', () => {
      if (currentChat) sendMessageToChat(currentChat);
    });

    chatInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && currentChat) {
        e.preventDefault();
        sendMessageToChat(currentChat);
      }
      if (e.key === 'Escape') {
        if (replyTo) {
          replyTo = null;
          replyBar.classList.remove('active');
        }
      }
    });

    openStickersBtn.addEventListener('click', () => {
      switchRightTab('stickers');
    });

    newChatBtn.addEventListener('click', createNewChat);

    clearAllBtn.addEventListener('click', clearAllChats);

    profileSaveBtn.addEventListener('click', () => {
      const val = usernameInput.value.trim() || 'Я';
      currentUser = val;
      localStorage.setItem(USER_KEY, val);
      updateUI();
      if (currentChat) renderMessages(currentChat);
    });

    usernameInput.addEventListener('change', () => {
      const val = usernameInput.value.trim() || 'Я';
      currentUser = val;
      localStorage.setItem(USER_KEY, val);
      updateUI();
      if (currentChat) renderMessages(currentChat);
    });

    profileExportBtn.addEventListener('click', exportHistory);

    profileImportBtn.addEventListener('click', () => {
      importFileInput.click();
    });

    importFileInput.addEventListener('change', (e) => {
      if (e.target.files.length > 0) {
        importHistory(e.target.files[0]);
        e.target.value = '';
      }
    });

    // ----- Инициализация -----
    renderStickers();

    const data = loadData();
    const chatNames = Object.keys(data.chats);
    if (chatNames.length > 0) {
      openChat(chatNames[0]);
    } else {
      emptyState.style.display = 'flex';
      chatActive.style.display = 'none';
    }

    updateUI();

    // Обновление при изменении в других вкладках
    window.addEventListener('storage', (e) => {
      if (e.key === STORAGE_KEY || e.key === USER_KEY) {
        if (e.key === USER_KEY) {
          currentUser = e.newValue || 'Я';
        }
        updateUI();
        if (currentChat) renderMessages(currentChat);
      }
    });

  })();
</script>
</body>
</html>
