<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>🍓 Ягодка — мессенджер</title>
  <style>
    /* ---------- Ягодный стиль (ПК) ---------- */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', Roboto, system-ui, sans-serif;
    }

    body {
      background: linear-gradient(145deg, #fce4ec 0%, #f8bbd0 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 24px;
    }

    .app-container {
      max-width: 1100px;
      width: 100%;
      height: 90vh;
      max-height: 800px;
      background: rgba(255, 245, 247, 0.92);
      backdrop-filter: blur(8px);
      border-radius: 32px;
      box-shadow: 0 20px 60px rgba(180, 60, 80, 0.25),
                  inset 0 1px 4px rgba(255, 255, 255, 0.6);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      border: 2px solid rgba(255, 255, 255, 0.5);
      position: relative;
    }

    /* ----- Шапка ----- */
    .app-header {
      background: linear-gradient(135deg, #d81b60, #ad1457);
      padding: 16px 28px;
      color: white;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 3px solid #f06292;
      flex-shrink: 0;
    }

    .app-header h1 {
      font-size: 26px;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .app-header h1 span {
      font-size: 30px;
    }

    .header-actions {
      display: flex;
      gap: 14px;
      align-items: center;
    }

    .header-actions button {
      background: rgba(255, 255, 255, 0.2);
      border: none;
      color: white;
      padding: 8px 18px;
      border-radius: 24px;
      font-size: 14px;
      cursor: pointer;
      transition: 0.2s;
      backdrop-filter: blur(4px);
      font-weight: 500;
    }

    .header-actions button:hover {
      background: rgba(255, 255, 255, 0.35);
      transform: scale(1.02);
    }

    .header-actions .badge {
      background: #ff6b6b;
      color: white;
      border-radius: 50%;
      padding: 2px 9px;
      font-size: 12px;
      font-weight: 700;
      margin-left: 6px;
    }

    /* ----- Основное содержимое (ПК: 3 колонки) ----- */
    .main-content {
      flex: 1;
      display: flex;
      overflow: hidden;
      position: relative;
    }

    /* ----- Левая панель: Чаты ----- */
    .sidebar {
      width: 320px;
      min-width: 280px;
      background: rgba(255, 240, 245, 0.3);
      border-right: 1px solid rgba(255, 255, 255, 0.3);
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
    }

    .sidebar-header {
      padding: 16px 20px 12px;
      font-weight: 700;
      font-size: 18px;
      color: #4a1a2a;
      border-bottom: 1px solid rgba(255, 255, 255, 0.3);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .sidebar-header .new-chat-btn {
      background: linear-gradient(135deg, #d81b60, #ad1457);
      border: none;
      color: white;
      padding: 6px 16px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: 0.2s;
    }

    .sidebar-header .new-chat-btn:hover {
      transform: scale(1.05);
    }

    .chat-list {
      flex: 1;
      overflow-y: auto;
      padding: 8px 12px;
    }

    .chat-item {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 14px 16px;
      background: rgba(255, 255, 255, 0.6);
      border-radius: 16px;
      margin-bottom: 6px;
      cursor: pointer;
      transition: 0.2s;
      border: 1px solid rgba(255, 255, 255, 0.3);
      backdrop-filter: blur(4px);
    }

    .chat-item:hover {
      background: rgba(255, 255, 255, 0.9);
      transform: translateX(4px);
      box-shadow: 0 4px 12px rgba(180, 60, 80, 0.1);
    }

    .chat-item.active {
      background: rgba(216, 27, 96, 0.12);
      border-color: #d81b60;
    }

    .chat-item .chat-avatar {
      width: 52px;
      height: 52px;
      border-radius: 50%;
      background: linear-gradient(135deg, #f06292, #ec407a);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      color: white;
      flex-shrink: 0;
    }

    .chat-item .chat-info {
      flex: 1;
      min-width: 0;
    }

    .chat-item .chat-name {
      font-weight: 600;
      color: #2a0a1a;
      font-size: 16px;
    }

    .chat-item .chat-last-msg {
      font-size: 13px;
      color: #7a4a5a;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .chat-item .chat-meta {
      text-align: right;
      flex-shrink: 0;
    }

    .chat-item .chat-time {
      font-size: 11px;
      color: #9a6a7a;
    }

    .chat-item .chat-unread {
      background: #d81b60;
      color: white;
      border-radius: 50%;
      padding: 2px 9px;
      font-size: 12px;
      font-weight: 700;
      margin-top: 4px;
      display: inline-block;
      min-width: 22px;
      text-align: center;
    }

    /* ----- Центральная панель: Чат ----- */
    .chat-panel {
      flex: 1;
      display: flex;
      flex-direction: column;
      background: rgba(255, 245, 247, 0.5);
      min-width: 0;
    }

    .chat-panel-empty {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: #7a4a5a;
      padding: 40px;
    }

    .chat-panel-empty .big-icon {
      font-size: 72px;
      margin-bottom: 16px;
    }

    .chat-panel-empty h2 {
      font-size: 24px;
      margin-bottom: 8px;
    }

    .chat-panel-empty p {
      opacity: 0.7;
    }

    .chat-panel-header {
      padding: 16px 24px;
      background: rgba(255, 255, 255, 0.6);
      border-bottom: 1px solid rgba(255, 255, 255, 0.3);
      display: flex;
      align-items: center;
      gap: 14px;
      flex-shrink: 0;
    }

    .chat-panel-header .chat-title {
      font-size: 20px;
      font-weight: 700;
      color: #2a0a1a;
    }

    .chat-panel-header .chat-status {
      font-size: 13px;
      color: #7a4a5a;
    }

    .chat-panel-header .chat-avatar-small {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: linear-gradient(135deg, #f06292, #ec407a);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      color: white;
      flex-shrink: 0;
    }

    .messages-area {
      flex: 1;
      padding: 20px 24px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .input-area {
      padding: 16px 24px 20px;
      background: rgba(255, 255, 255, 0.5);
      backdrop-filter: blur(4px);
      border-top: 1px solid rgba(255, 255, 255, 0.3);
      display: flex;
      gap: 10px;
      align-items: center;
      flex-shrink: 0;
    }

    .input-area input[type="text"] {
      flex: 1;
      padding: 12px 20px;
      border: none;
      border-radius: 30px;
      background: white;
      font-size: 16px;
      outline: 2px solid transparent;
      transition: 0.2s;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
    }

    .input-area input[type="text"]:focus {
      outline: 2px solid #ec407a;
      box-shadow: 0 4px 16px rgba(216, 27, 96, 0.1);
    }

    .input-area button {
      background: linear-gradient(135deg, #d81b60, #ad1457);
      border: none;
      color: white;
      padding: 12px 28px;
      border-radius: 30px;
      font-weight: 600;
      font-size: 16px;
      cursor: pointer;
      transition: 0.2s;
      box-shadow: 0 4px 16px rgba(216, 27, 96, 0.25);
      white-space: nowrap;
    }

    .input-area button:hover {
      transform: scale(1.03);
      box-shadow: 0 6px 24px rgba(216, 27, 96, 0.35);
    }

    .input-area button:active {
      transform: scale(0.96);
    }

    .input-area .sticker-btn {
      background: rgba(216, 27, 96, 0.1);
      color: #d81b60;
      padding: 12px 16px;
      font-size: 24px;
      box-shadow: none;
      min-width: 52px;
    }

    .input-area .sticker-btn:hover {
      background: rgba(216, 27, 96, 0.2);
      transform: scale(1.05);
    }

    /* ----- Правая панель: Стикеры и Профиль (вкладки) ----- */
    .right-panel {
      width: 320px;
      min-width: 280px;
      background: rgba(255, 240, 245, 0.2);
      border-left: 1px solid rgba(255, 255, 255, 0.3);
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
      overflow: hidden;
    }

    .right-panel-tabs {
      display: flex;
      border-bottom: 1px solid rgba(255, 255, 255, 0.3);
      flex-shrink: 0;
    }

    .right-panel-tabs button {
      flex: 1;
      padding: 14px 0;
      border: none;
      background: transparent;
      font-size: 14px;
      font-weight: 600;
      color: #7a4a5a;
      cursor: pointer;
      transition: 0.2s;
      border-bottom: 3px solid transparent;
    }

    .right-panel-tabs button.active {
      color: #d81b60;
      border-bottom-color: #d81b60;
      background: rgba(216, 27, 96, 0.05);
    }

    .right-panel-tabs button:hover {
      background: rgba(216, 27, 96, 0.05);
    }

    .right-panel-content {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
    }

    .right-tab {
      display: none;
    }

    .right-tab.active {
      display: block;
    }

    /* ----- Стикеры (правая панель) ----- */
    .stickers-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
    }

    .sticker-item {
      aspect-ratio: 1;
      background: rgba(255, 255, 255, 0.7);
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 36px;
      cursor: pointer;
      transition: 0.2s;
      border: 2px solid transparent;
      backdrop-filter: blur(4px);
    }

    .sticker-item:hover {
      transform: scale(1.1);
      border-color: #d81b60;
      background: rgba(255, 255, 255, 0.95);
      box-shadow: 0 4px 16px rgba(216, 27, 96, 0.15);
    }

    .sticker-item:active {
      transform: scale(0.92);
    }

    .sticker-category {
      font-size: 14px;
      font-weight: 600;
      color: #4a1a2a;
      margin: 14px 0 8px;
      padding-left: 4px;
    }

    /* ----- Профиль (правая панель) ----- */
    .profile-content {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 8px 0;
    }

    .profile-avatar {
      width: 90px;
      height: 90px;
      border-radius: 50%;
      background: linear-gradient(135deg, #f06292, #ec407a);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 40px;
      color: white;
      margin-bottom: 12px;
      box-shadow: 0 8px 24px rgba(216, 27, 96, 0.2);
      border: 4px solid white;
    }

    .profile-name {
      font-size: 22px;
      font-weight: 700;
      color: #2a0a1a;
      margin-bottom: 2px;
    }

    .profile-status {
      color: #7a4a5a;
      font-size: 14px;
      margin-bottom: 20px;
    }

    .profile-field {
      width: 100%;
      padding: 12px 16px;
      background: rgba(255, 255, 255, 0.7);
      border-radius: 12px;
      margin-bottom: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border: 1px solid rgba(255, 255, 255, 0.3);
    }

    .profile-field .label {
      color: #7a4a5a;
      font-size: 13px;
    }

    .profile-field .value {
      font-weight: 600;
      color: #2a0a1a;
    }

    .profile-field input {
      border: none;
      background: transparent;
      font-weight: 600;
      color: #2a0a1a;
      font-size: 14px;
      text-align: right;
      outline: none;
      width: 140px;
    }

    .profile-field input::placeholder {
      color: #b0a0a8;
    }

    .profile-stats {
      display: flex;
      gap: 30px;
      margin: 12px 0 18px;
      width: 100%;
      justify-content: center;
    }

    .profile-stats .stat {
      text-align: center;
    }

    .profile-stats .stat .num {
      font-size: 22px;
      font-weight: 700;
      color: #d81b60;
    }

    .profile-stats .stat .label {
      font-size: 12px;
      color: #7a4a5a;
    }

    .profile-btn {
      background: linear-gradient(135deg, #d81b60, #ad1457);
      border: none;
      color: white;
      padding: 12px 28px;
      border-radius: 30px;
      font-weight: 600;
      font-size: 15px;
      cursor: pointer;
      transition: 0.2s;
      box-shadow: 0 4px 12px rgba(216, 27, 96, 0.3);
      width: 100%;
      margin-top: 4px;
    }

    .profile-btn:hover {
      transform: scale(1.02);
      box-shadow: 0 6px 20px rgba(216, 27, 96, 0.4);
    }

    .profile-btn-outline {
      background: transparent;
      border: 2px solid #d81b60;
      color: #d81b60;
      padding: 10px 20px;
      border-radius: 30px;
      font-weight: 600;
      font-size: 14px;
      cursor: pointer;
      transition: 0.2s;
      margin-top: 8px;
      width: 100%;
      text-align: center;
    }

    .profile-btn-outline:hover {
      background: #d81b60;
      color: white;
    }

    /* ----- Сообщения (ягодный стиль) ----- */
    .message {
      max-width: 70%;
      padding: 10px 18px;
      border-radius: 24px 24px 24px 6px;
      background: white;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
      align-self: flex-start;
      word-break: break-word;
      border: 1px solid rgba(255, 255, 255, 0.5);
      animation: fadeUp 0.25s ease;
      margin-bottom: 2px;
    }

    .message.own {
      align-self: flex-end;
      background: linear-gradient(135deg, #f06292, #ec407a);
      color: white;
      border-radius: 24px 24px 6px 24px;
    }

    .message .msg-user {
      font-weight: 600;
      font-size: 13px;
      color: #880e4f;
      margin-bottom: 2px;
      display: flex;
      justify-content: space-between;
      gap: 14px;
    }

    .message.own .msg-user {
      color: #fce4ec;
    }

    .message .msg-time {
      font-size: 10px;
      opacity: 0.7;
      font-weight: 400;
    }

    .message .msg-text {
      font-size: 15px;
      line-height: 1.45;
    }

    .message .sticker-emoji {
      font-size: 56px;
      display: block;
      text-align: center;
      padding: 4px 0;
      line-height: 1.2;
    }

    .date-divider {
      text-align: center;
      font-size: 12px;
      color: #7a4a5a;
      padding: 10px 0 6px;
    }

    .date-divider span {
      background: rgba(255, 255, 255, 0.6);
      padding: 4px 18px;
      border-radius: 20px;
      font-weight: 500;
    }

    /* Анимация */
    @keyframes fadeUp {
      0% { opacity: 0; transform: translateY(10px); }
      100% { opacity: 1; transform: translateY(0); }
    }

    /* Скролл */
    .chat-list::-webkit-scrollbar,
    .messages-area::-webkit-scrollbar,
    .right-panel-content::-webkit-scrollbar {
      width: 5px;
    }

    .chat-list::-webkit-scrollbar-thumb,
    .messages-area::-webkit-scrollbar-thumb,
    .right-panel-content::-webkit-scrollbar-thumb {
      background: #f06292;
      border-radius: 10px;
    }

    .chat-list::-webkit-scrollbar-track,
    .messages-area::-webkit-scrollbar-track,
    .right-panel-content::-webkit-scrollbar-track {
      background: transparent;
    }

    /* ----- Адаптив для ПК (маленькие экраны) ----- */
    @media (max-width: 900px) {
      .sidebar {
        width: 240px;
        min-width: 200px;
      }
      .right-panel {
        width: 260px;
        min-width: 220px;
      }
      .stickers-grid {
        grid-template-columns: repeat(3, 1fr);
      }
    }

    @media (max-width: 700px) {
      body {
        padding: 8px;
      }
      .app-container {
        height: 98vh;
        max-height: none;
        border-radius: 16px;
      }
      .sidebar {
        width: 200px;
        min-width: 160px;
      }
      .right-panel {
        width: 200px;
        min-width: 160px;
      }
      .stickers-grid {
        grid-template-columns: repeat(3, 1fr);
      }
      .chat-item {
        padding: 10px 12px;
      }
      .chat-item .chat-avatar {
        width: 38px;
        height: 38px;
        font-size: 16px;
      }
      .chat-item .chat-name {
        font-size: 14px;
      }
      .message {
        max-width: 85%;
      }
    }
  </style>
</head>
<body>

<div class="app-container">
  <!-- Шапка -->
  <div class="app-header">
    <h1><span>🍓</span> Ягодка</h1>
    <div class="header-actions">
      <button id="clearAllBtn">🗑️ Очистить всё</button>
      <span id="unreadBadge" class="badge" style="display:none;">0</span>
    </div>
  </div>

  <!-- Основное содержимое (3 колонки) -->
  <div class="main-content">
    <!-- Левая панель: Чаты -->
    <div class="sidebar">
      <div class="sidebar-header">
        <span>💬 Чаты</span>
        <button class="new-chat-btn" id="newChatBtn">+ Новый</button>
      </div>
      <div class="chat-list" id="chatList"></div>
    </div>

    <!-- Центральная панель: Чат -->
    <div class="chat-panel" id="chatPanel">
      <div class="chat-panel-empty" id="emptyState">
        <div class="big-icon">🍓</div>
        <h2>Добро пожаловать!</h2>
        <p>Выберите чат слева или создайте новый</p>
      </div>
      <div id="chatActive" style="display:none;flex-direction:column;height:100%;">
        <div class="chat-panel-header">
          <div class="chat-avatar-small" id="panelAvatar">🍓</div>
          <div>
            <div class="chat-title" id="panelTitle">Чат</div>
            <div class="chat-status" id="panelStatus">онлайн</div>
          </div>
        </div>
        <div class="messages-area" id="messagesArea"></div>
        <div class="input-area">
          <button class="sticker-btn" id="openStickersBtn">😊</button>
          <input type="text" id="chatInput" placeholder="Напишите сообщение..." maxlength="300" />
          <button id="chatSendBtn">🍒 Отправить</button>
        </div>
      </div>
    </div>

    <!-- Правая панель: Стикеры + Профиль -->
    <div class="right-panel">
      <div class="right-panel-tabs">
        <button class="active" data-rtab="stickers">😊 Стикеры</button>
        <button data-rtab="profile">👤 Профиль</button>
      </div>
      <div class="right-panel-content">
        <!-- Вкладка: Стикеры -->
        <div class="right-tab active" id="rtab-stickers">
          <div class="sticker-category">🍓 Ягодные</div>
          <div class="stickers-grid" id="stickerGrid1"></div>

          <div class="sticker-category">😊 Смайлы</div>
          <div class="stickers-grid" id="stickerGrid2"></div>

          <div class="sticker-category">❤️ Сердечки</div>
          <div class="stickers-grid" id="stickerGrid3"></div>

          <div class="sticker-category">🎉 Праздничные</div>
          <div class="stickers-grid" id="stickerGrid4"></div>
        </div>

        <!-- Вкладка: Профиль -->
        <div class="right-tab" id="rtab-profile">
          <div class="profile-content">
            <div class="profile-avatar">🍓</div>
            <div class="profile-name" id="profileName">Я</div>
            <div class="profile-status">🍒 Онлайн</div>

            <div class="profile-stats">
              <div class="stat">
                <div class="num" id="statMessages">0</div>
                <div class="label">Сообщений</div>
              </div>
              <div class="stat">
                <div class="num" id="statChats">0</div>
                <div class="label">Чатов</div>
              </div>
              <div class="stat">
                <div class="num" id="statStickers">0</div>
                <div class="label">Стикеров</div>
              </div>
            </div>

            <div class="profile-field">
              <span class="label">👤 Имя</span>
              <input type="text" id="profileUsername" placeholder="Ваше имя" maxlength="20" />
            </div>

            <div class="profile-field">
              <span class="label">🆔 ID</span>
              <span class="value" id="profileId">#yagodka-user</span>
            </div>

            <button class="profile-btn" id="profileSaveBtn">💾 Сохранить</button>
            <button class="profile-btn-outline" id="profileExportBtn">📤 Экспорт истории</button>
            <button class="profile-btn-outline" id="profileImportBtn">📥 Импорт истории</button>
            <input type="file" id="importFileInput" accept=".json" style="display:none;" />
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
  (function() {
    // ----- Данные -----
    const STORAGE_KEY = 'yagodka_data';
    const USER_KEY = 'yagodka_username';

    // Коллекция стикеров
    const STICKERS = {
      'Ягодные': ['🍓', '🍒', '🫐', '🍇', '🍉', '🍊', '🍋', '🍌', '🍑', '🍎', '🍏', '🍐'],
      'Смайлы': ['😊', '😂', '😍', '🤩', '😎', '🤗', '😇', '🥰', '😘', '🤪', '😜', '🤭'],
      'Сердечки': ['❤️', '🧡', '💛', '💚', '💙', '💜', '🖤', '🤍', '💕', '💗', '💖', '💘'],
      'Праздничные': ['🎉', '🎊', '🎈', '🎁', '🎀', '✨', '🌟', '⭐', '🔥', '💫', '🌈', '🎵']
    };

    // ----- Элементы -----
    const chatList = document.getElementById('chatList');
    const messagesArea = document.getElementById('messagesArea');
    const chatInput = document.getElementById('chatInput');
    const chatSendBtn = document.getElementById('chatSendBtn');
    const panelTitle = document.getElementById('panelTitle');
    const panelStatus = document.getElementById('panelStatus');
    const panelAvatar = document.getElementById('panelAvatar');
    const emptyState = document.getElementById('emptyState');
    const chatActive = document.getElementById('chatActive');
    const openStickersBtn = document.getElementById('openStickersBtn');

    const usernameInput = document.getElementById('profileUsername');
    const profileName = document.getElementById('profileName');
    const profileId = document.getElementById('profileId');
    const statMessages = document.getElementById('statMessages');
    const statChats = document.getElementById('statChats');
    const statStickers = document.getElementById('statStickers');
    const unreadBadge = document.getElementById('unreadBadge');
    const clearAllBtn = document.getElementById('clearAllBtn');
    const profileSaveBtn = document.getElementById('profileSaveBtn');
    const profileExportBtn = document.getElementById('profileExportBtn');
    const profileImportBtn = document.getElementById('profileImportBtn');
    const importFileInput = document.getElementById('importFileInput');
    const newChatBtn = document.getElementById('newChatBtn');

    const rightTabs = document.querySelectorAll('.right-panel-tabs button');
    const rightContents = {
      stickers: document.getElementById('rtab-stickers'),
      profile: document.getElementById('rtab-profile')
    };

    // ----- Состояние -----
    let currentUser = localStorage.getItem(USER_KEY) || 'Я';
    let currentChat = null;

    // ----- Работа с данными -----
    function loadData() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        return raw ? JSON.parse(raw) : { chats: {}, unread: {} };
      } catch {
        return { chats: {}, unread: {} };
      }
    }

    function saveData(data) {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
    }

    function getChatMessages(chatName) {
      const data = loadData();
      if (!data.chats[chatName]) {
        data.chats[chatName] = [];
      }
      return data.chats[chatName];
    }

    function saveChatMessages(chatName, messages) {
      const data = loadData();
      data.chats[chatName] = messages;
      saveData(data);
    }

    function markAsRead(chatName) {
      const data = loadData();
      if (data.unread && data.unread[chatName]) {
        delete data.unread[chatName];
        saveData(data);
        updateUI();
      }
    }

    function getUnreadCount(chatName) {
      const data = loadData();
      return (data.unread && data.unread[chatName]) || 0;
    }

    function incrementUnread(chatName) {
      const data = loadData();
      if (!data.unread) data.unread = {};
      data.unread[chatName] = (data.unread[chatName] || 0) + 1;
      saveData(data);
      updateUI();
    }

    // ----- Инициализация чатов по умолчанию -----
    function initDefaultChats() {
      const data = loadData();
      const defaultChats = ['🍓 Ягодка', '🌸 Цветочки', '🌿 Зелёный', '☀️ Солнышко'];
      let changed = false;

      defaultChats.forEach(name => {
        if (!data.chats[name]) {
          data.chats[name] = [];
          changed = true;
          if (name === '🍓 Ягодка') {
            data.chats[name].push({ user: 'Ягодка', text: '🍓 Добро пожаловать в Ягодку!', timestamp: Date.now() - 60000 });
          } else {
            data.chats[name].push({ user: name, text: '👋 Привет! Как дела?', timestamp: Date.now() - 30000 });
          }
        }
      });

      if (changed) saveData(data);
    }

    initDefaultChats();

    // ----- Форматирование -----
    function formatTime(timestamp) {
      if (!timestamp) return '';
      const date = new Date(timestamp);
      return date.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    }

    function formatDate(timestamp) {
      const date = new Date(timestamp);
      const now = new Date();
      const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
      const yesterday = new Date(today);
      yesterday.setDate(yesterday.getDate() - 1);

      const msgDate = new Date(date.getFullYear(), date.getMonth(), date.getDate());

      if (msgDate.getTime() === today.getTime()) return 'Сегодня';
      if (msgDate.getTime() === yesterday.getTime()) return 'Вчера';
      return date.toLocaleDateString('ru-RU', { day: 'numeric', month: 'long' });
    }

    function isEmoji(str) {
      if (!str || str.length > 4) return false;
      const emojiRegex = /^[\u{1F000}-\u{1FFFF}]|[\u2600-\u{27BF}]|[\u{FE00}-\u{FEFF}]|[\u{1F600}-\u{1F64F}]|[\u{1F300}-\u{1F5FF}]|[\u{1F680}-\u{1F6FF}]|[\u{1F700}-\u{1F77F}]|[\u{1F780}-\u{1F7FF}]|[\u{1F800}-\u{1F8FF}]|[\u{1F900}-\u{1F9FF}]|[\u{1FA00}-\u{1FA6F}]|[\u{1FA70}-\u{1FAFF}]|[\u{2700}-\u{27BF}]|[\u{2600}-\u{26FF}]|[\u{2300}-\u{23FF}]|[\u{1F1E0}-\u{1F1FF}]$/u;
      return emojiRegex.test(str);
    }

    function escapeHtml(str) {
      const div = document.createElement('div');
      div.textContent = str;
      return div.innerHTML;
    }

    // ----- Рендер списка чатов -----
    function renderChatList() {
      const data = loadData();
      const chatNames = Object.keys(data.chats);
      chatList.innerHTML = '';

      if (chatNames.length === 0) {
        chatList.innerHTML = `
          <div style="text-align:center;padding:30px 16px;color:#7a4a5a;">
            <div style="font-size:40px;margin-bottom:8px;">🍓</div>
            <div style="font-weight:600;">Нет чатов</div>
            <div style="font-size:13px;opacity:0.7;">Создайте первый чат</div>
          </div>
        `;
        return;
      }

      chatNames.forEach(name => {
        const messages = data.chats[name] || [];
        const lastMsg = messages[messages.length - 1];
        const unread = getUnreadCount(name);
        const isActive = name === currentChat;

        const div = document.createElement('div');
        div.className = `chat-item${isActive ? ' active' : ''}`;
        div.dataset.chat = name;

        const avatar = document.createElement('div');
        avatar.className = 'chat-avatar';
        avatar.textContent = name.charAt(0) || '💬';

        const info = document.createElement('div');
        info.className = 'chat-info';

        const nameSpan = document.createElement('div');
        nameSpan.className = 'chat-name';
        nameSpan.textContent = name;

        const lastMsgSpan = document.createElement('div');
        lastMsgSpan.className = 'chat-last-msg';
        if (lastMsg) {
          const text = lastMsg.text || '';
          lastMsgSpan.textContent = text.length > 30 ? text.slice(0, 30) + '...' : text;
        } else {
          lastMsgSpan.textContent = 'Нет сообщений';
        }

        info.appendChild(nameSpan);
        info.appendChild(lastMsgSpan);

        const meta = document.createElement('div');
        meta.className = 'chat-meta';

        const timeSpan = document.createElement('div');
        timeSpan.className = 'chat-time';
        timeSpan.textContent = lastMsg ? formatTime(lastMsg.timestamp) : '';

        meta.appendChild(timeSpan);

        if (unread > 0) {
          const badge = document.createElement('div');
          badge.className = 'chat-unread';
          badge.textContent = unread;
          meta.appendChild(badge);
        }

        div.appendChild(avatar);
        div.appendChild(info);
        div.appendChild(meta);

        div.addEventListener('click', () => openChat(name));

        chatList.appendChild(div);
      });

      updateUnreadBadge();
    }

    // ----- Открыть чат -----
    function openChat(chatName) {
      currentChat = chatName;
      markAsRead(chatName);

      emptyState.style.display = 'none';
      chatActive.style.display = 'flex';

      const data = loadData();
      const messages = data.chats[chatName] || [];

      panelTitle.textContent = chatName;
      panelStatus.textContent = 'онлайн';
      panelAvatar.textContent = chatName.charAt(0) || '🍓';

      renderMessages(chatName);
      chatInput.focus();
      updateUI();
    }

    // ----- Рендер сообщений -----
    function renderMessages(chatName) {
      const messages = getChatMessages(chatName);
      messagesArea.innerHTML = '';

      let lastDate = '';

      messages.forEach((msg) => {
        const msgDate = formatDate(msg.timestamp || Date.now());

        if (msgDate !== lastDate) {
          const divider = document.createElement('div');
          divider.className = 'date-divider';
          divider.innerHTML = `<span>${msgDate}</span>`;
          messagesArea.appendChild(divider);
          lastDate = msgDate;
        }

        const isOwn = msg.user === currentUser || (msg.user === 'Я');
        const div = document.createElement('div');
        div.className = `message ${isOwn ? 'own' : ''}`;

        const userSpan = document.createElement('div');
        userSpan.className = 'msg-user';
        userSpan.innerHTML = `
          <span>${escapeHtml(msg.user)}</span>
          <span class="msg-time">${formatTime(msg.timestamp)}</span>
        `;

        const textSpan = document.createElement('div');
        textSpan.className = 'msg-text';

        // Проверяем, стикер ли это
        if (msg.text && isEmoji(msg.text)) {
          textSpan.className = 'sticker-emoji';
          textSpan.textContent = msg.text;
        } else {
          textSpan.textContent = msg.text;
        }

        div.appendChild(userSpan);
        div.appendChild(textSpan);
        messagesArea.appendChild(div);
      });

      messagesArea.scrollTop = messagesArea.scrollHeight;
    }

    // ----- Отправка сообщения -----
    function sendMessageToChat(chatName) {
      const text = chatInput.value.trim();
      if (!text || !chatName) return;

      const messages = getChatMessages(chatName);
      messages.push({
        user: currentUser || 'Я',
        text: text,
        timestamp: Date.now()
      });
      saveChatMessages(chatName, messages);

      chatInput.value = '';
      renderMessages(chatName);
      updateUI();
      renderChatList();
    }

    // ----- Отправка стикера -----
    function sendSticker(chatName, sticker) {
      if (!chatName) {
        const data = loadData();
        const chatNames = Object.keys(data.chats);
        if (chatNames.length === 0) {
          alert('Сначала создайте чат!');
          return;
        }
        chatName = chatNames[0];
        openChat(chatName);
      }

      const messages = getChatMessages(chatName);
      messages.push({
        user: currentUser || 'Я',
        text: sticker,
        timestamp: Date.now()
      });
      saveChatMessages(chatName, messages);
      renderMessages(chatName);
      updateUI();
      renderChatList();

      // Если чат не активен, увеличиваем счётчик
      if (currentChat !== chatName) {
        incrementUnread(chatName);
      }
    }

    // ----- Рендер стикеров -----
    function renderStickers() {
      const gridIds = ['stickerGrid1', 'stickerGrid2', 'stickerGrid3', 'stickerGrid4'];
      const categories = Object.keys(STICKERS);

      categories.forEach((cat, idx) => {
        const grid = document.getElementById(gridIds[idx]);
        if (!grid) return;
        grid.innerHTML = '';
        STICKERS[cat].forEach(sticker => {
          const div = document.createElement('div');
          div.className = 'sticker-item';
          div.textContent = sticker;
          div.title = `Отправить ${sticker}`;
          div.addEventListener('click', () => {
            sendSticker(currentChat, sticker);
          });
          grid.appendChild(div);
        });
      });
    }

    // ----- Обновление UI -----
    function updateUI() {
      const data = loadData();
      const chatNames = Object.keys(data.chats);
      let totalMessages = 0;
      chatNames.forEach(name => {
        totalMessages += (data.chats[name] || []).length;
      });

      statMessages.textContent = totalMessages;
      statChats.textContent = chatNames.length;
      statStickers.textContent = Object.values(STICKERS).flat().length;

      profileName.textContent = currentUser;
      usernameInput.value = currentUser;
      profileId.textContent = '#yagodka-' + currentUser.toLowerCase().replace(/[^a-zа-я]/g, '');

      renderChatList();
      updateUnreadBadge();
    }

    function updateUnreadBadge() {
      const data = loadData();
      const unread = data.unread || {};
      const total = Object.values(unread).reduce((sum, val) => sum + val, 0);
      if (total > 0) {
        unreadBadge.style.display = 'inline';
        unreadBadge.textContent = total > 9 ? '9+' : total;
      } else {
        unreadBadge.style.display = 'none';
      }
    }

    // ----- Создание нового чата -----
    function createNewChat() {
      const name = prompt('🍓 Введите название нового чата:');
      if (!name || name.trim() === '') return;
      const chatName = name.trim();

      const data = loadData();
      if (data.chats[chatName]) {
        alert('Чат с таким именем уже существует!');
        return;
      }

      data.chats[chatName] = [];
      data.chats[chatName].push({
        user: 'Ягодка',
        text: `🍓 Добро пожаловать в чат "${chatName}"!`,
        timestamp: Date.now()
      });
      saveData(data);
      openChat(chatName);
      updateUI();
    }

    // ----- Очистка всех чатов -----
    function clearAllChats() {
      if (confirm('🧹 Очистить все чаты?')) {
        const data = loadData();
        const chatNames = Object.keys(data.chats);
        chatNames.forEach(name => {
          data.chats[name] = [];
        });
        data.unread = {};
        saveData(data);
        if (currentChat) {
          renderMessages(currentChat);
        }
        updateUI();
      }
    }

    // ----- Экспорт/Импорт -----
    function exportHistory() {
      const data = loadData();
      const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `yagodka_history_${new Date().toISOString().slice(0,10)}.json`;
      a.click();
      URL.revokeObjectURL(url);
    }

    function importHistory(file) {
      const reader = new FileReader();
      reader.onload = (e) => {
        try {
          const data = JSON.parse(e.target.result);
          if (data.chats && typeof data.chats === 'object') {
            saveData(data);
            if (currentChat) {
              renderMessages(currentChat);
            }
            updateUI();
            alert('✅ История успешно импортирована!');
          } else {
            alert('❌ Неверный формат файла');
          }
        } catch (err) {
          alert('❌ Ошибка при импорте: ' + err.message);
        }
      };
      reader.readAsText(file);
    }

    // ----- Переключение правой панели -----
    function switchRightTab(tabId) {
      rightTabs.forEach(btn => {
        btn.classList.toggle('active', btn.dataset.rtab === tabId);
      });
      Object.keys(rightContents).forEach(key => {
        rightContents[key].classList.toggle('active', key === tabId);
      });
    }

    rightTabs.forEach(btn => {
      btn.addEventListener('click', () => {
        switchRightTab(btn.dataset.rtab);
      });
    });

    // ----- Обработчики -----
    chatSendBtn.addEventListener('click', () => {
      if (currentChat) sendMessageToChat(currentChat);
    });

    chatInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && currentChat) {
        e.preventDefault();
        sendMessageToChat(currentChat);
      }
    });

    openStickersBtn.addEventListener('click', () => {
      switchRightTab('stickers');
    });

    newChatBtn.addEventListener('click', createNewChat);

    clearAllBtn.addEventListener('click', clearAllChats);

    profileSaveBtn.addEventListener('click', () => {
      const val = usernameInput.value.trim() || 'Я';
      currentUser = val;
      localStorage.setItem(USER_KEY, val);
      updateUI();
      if (currentChat) renderMessages(currentChat);
    });

    usernameInput.addEventListener('change', () => {
      const val = usernameInput.value.trim() || 'Я';
      currentUser = val;
      localStorage.setItem(USER_KEY, val);
      updateUI();
      if (currentChat) renderMessages(currentChat);
    });

    profileExportBtn.addEventListener('click', exportHistory);

    profileImportBtn.addEventListener('click', () => {
      importFileInput.click();
    });

    importFileInput.addEventListener('change', (e) => {
      if (e.target.files.length > 0) {
        importHistory(e.target.files[0]);
        e.target.value = '';
      }
    });

    // ----- Инициализация -----
    renderStickers();

    // Открываем первый чат
    const data = loadData();
    const chatNames = Object.keys(data.chats);
    if (chatNames.length > 0) {
      openChat(chatNames[0]);
    } else {
      emptyState.style.display = 'flex';
      chatActive.style.display = 'none';
    }

    updateUI();

    // Обновление при изменении в других вкладках
    window.addEventListener('storage', (e) => {
      if (e.key === STORAGE_KEY || e.key === USER_KEY) {
        if (e.key === USER_KEY) {
          currentUser = e.newValue || 'Я';
        }
        updateUI();
        if (currentChat) renderMessages(currentChat);
      }
    });

  })();
</script>
</body>
</html>
