<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>🍓 Ягодка — мессенджер</title>
  <style>
    /* ---------- Ягодный стиль ---------- */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', Roboto, system-ui, sans-serif;
    }

    body {
      background: linear-gradient(145deg, #fce4ec 0%, #f8bbd0 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 16px;
    }

    .app-container {
      max-width: 420px;
      width: 100%;
      height: 92vh;
      max-height: 780px;
      background: rgba(255, 245, 247, 0.92);
      backdrop-filter: blur(8px);
      border-radius: 40px 40px 28px 28px;
      box-shadow: 0 20px 40px rgba(180, 60, 80, 0.2),
                  inset 0 1px 4px rgba(255, 255, 255, 0.6);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      border: 2px solid rgba(255, 255, 255, 0.5);
      position: relative;
    }

    /* ----- Шапка ----- */
    .app-header {
      background: linear-gradient(135deg, #d81b60, #ad1457);
      padding: 18px 20px 14px;
      color: white;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 3px solid #f06292;
      flex-shrink: 0;
    }

    .app-header h1 {
      font-size: 22px;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .app-header h1 span {
      font-size: 26px;
    }

    .header-actions {
      display: flex;
      gap: 12px;
      align-items: center;
    }

    .header-actions button {
      background: rgba(255, 255, 255, 0.2);
      border: none;
      color: white;
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 13px;
      cursor: pointer;
      transition: 0.2s;
      backdrop-filter: blur(4px);
    }

    .header-actions button:hover {
      background: rgba(255, 255, 255, 0.35);
    }

    .header-actions .badge {
      background: #ff6b6b;
      color: white;
      border-radius: 50%;
      padding: 1px 7px;
      font-size: 11px;
      font-weight: 700;
      margin-left: 4px;
    }

    /* ----- Основное содержимое ----- */
    .main-content {
      flex: 1;
      overflow: hidden;
      position: relative;
    }

    .tab-content {
      display: none;
      height: 100%;
      flex-direction: column;
    }

    .tab-content.active {
      display: flex;
    }

    /* ----- Вкладка "Чаты" ----- */
    .chat-list {
      flex: 1;
      overflow-y: auto;
      padding: 12px 16px;
      background: rgba(255, 240, 245, 0.2);
    }

    .chat-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 14px;
      background: rgba(255, 255, 255, 0.7);
      border-radius: 16px;
      margin-bottom: 8px;
      cursor: pointer;
      transition: 0.2s;
      border: 1px solid rgba(255, 255, 255, 0.3);
      backdrop-filter: blur(4px);
    }

    .chat-item:hover {
      background: rgba(255, 255, 255, 0.9);
      transform: scale(1.01);
    }

    .chat-item .chat-avatar {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: linear-gradient(135deg, #f06292, #ec407a);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      color: white;
      flex-shrink: 0;
    }

    .chat-item .chat-info {
      flex: 1;
      min-width: 0;
    }

    .chat-item .chat-name {
      font-weight: 600;
      color: #4a1a2a;
      font-size: 15px;
    }

    .chat-item .chat-last-msg {
      font-size: 13px;
      color: #7a4a5a;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .chat-item .chat-meta {
      text-align: right;
      flex-shrink: 0;
    }

    .chat-item .chat-time {
      font-size: 11px;
      color: #9a6a7a;
    }

    .chat-item .chat-unread {
      background: #d81b60;
      color: white;
      border-radius: 50%;
      padding: 2px 8px;
      font-size: 11px;
      font-weight: 700;
      margin-top: 4px;
      display: inline-block;
    }

    /* ----- Вкладка "Профиль" ----- */
    .profile-content {
      flex: 1;
      padding: 30px 24px;
      overflow-y: auto;
      background: rgba(255, 240, 245, 0.2);
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .profile-avatar {
      width: 100px;
      height: 100px;
      border-radius: 50%;
      background: linear-gradient(135deg, #f06292, #ec407a);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 44px;
      color: white;
      margin-bottom: 16px;
      box-shadow: 0 8px 24px rgba(216, 27, 96, 0.2);
      border: 4px solid white;
    }

    .profile-name {
      font-size: 24px;
      font-weight: 700;
      color: #2a0a1a;
      margin-bottom: 4px;
    }

    .profile-status {
      color: #7a4a5a;
      font-size: 14px;
      margin-bottom: 24px;
    }

    .profile-field {
      width: 100%;
      max-width: 300px;
      padding: 12px 16px;
      background: rgba(255, 255, 255, 0.7);
      border-radius: 12px;
      margin-bottom: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border: 1px solid rgba(255, 255, 255, 0.3);
    }

    .profile-field .label {
      color: #7a4a5a;
      font-size: 13px;
    }

    .profile-field .value {
      font-weight: 600;
      color: #2a0a1a;
    }

    .profile-field input {
      border: none;
      background: transparent;
      font-weight: 600;
      color: #2a0a1a;
      font-size: 14px;
      text-align: right;
      outline: none;
      width: 120px;
    }

    .profile-field input::placeholder {
      color: #b0a0a8;
    }

    .profile-stats {
      display: flex;
      gap: 30px;
      margin: 16px 0 20px;
    }

    .profile-stats .stat {
      text-align: center;
    }

    .profile-stats .stat .num {
      font-size: 20px;
      font-weight: 700;
      color: #d81b60;
    }

    .profile-stats .stat .label {
      font-size: 12px;
      color: #7a4a5a;
    }

    .profile-btn {
      background: linear-gradient(135deg, #d81b60, #ad1457);
      border: none;
      color: white;
      padding: 12px 32px;
      border-radius: 30px;
      font-weight: 600;
      font-size: 15px;
      cursor: pointer;
      transition: 0.2s;
      box-shadow: 0 4px 12px rgba(216, 27, 96, 0.3);
    }

    .profile-btn:hover {
      transform: scale(1.03);
      box-shadow: 0 6px 20px rgba(216, 27, 96, 0.4);
    }

    .profile-btn-outline {
      background: transparent;
      border: 2px solid #d81b60;
      color: #d81b60;
      padding: 10px 28px;
      border-radius: 30px;
      font-weight: 600;
      font-size: 14px;
      cursor: pointer;
      transition: 0.2s;
      margin-top: 8px;
    }

    .profile-btn-outline:hover {
      background: #d81b60;
      color: white;
    }

    /* ----- Вкладка "Стикеры" ----- */
    .stickers-content {
      flex: 1;
      padding: 16px;
      overflow-y: auto;
      background: rgba(255, 240, 245, 0.2);
    }

    .stickers-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
    }

    .sticker-item {
      aspect-ratio: 1;
      background: rgba(255, 255, 255, 0.7);
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 40px;
      cursor: pointer;
      transition: 0.2s;
      border: 2px solid transparent;
      backdrop-filter: blur(4px);
    }

    .sticker-item:hover {
      transform: scale(1.08);
      border-color: #d81b60;
      background: rgba(255, 255, 255, 0.95);
    }

    .sticker-item:active {
      transform: scale(0.92);
    }

    .sticker-category {
      font-size: 13px;
      font-weight: 600;
      color: #4a1a2a;
      margin: 16px 0 8px;
      padding-left: 4px;
    }

    /* ----- Нижняя навигация ----- */
    .bottom-nav {
      display: flex;
      background: rgba(255, 255, 255, 0.6);
      backdrop-filter: blur(8px);
      border-top: 1px solid rgba(255, 255, 255, 0.3);
      flex-shrink: 0;
    }

    .bottom-nav button {
      flex: 1;
      padding: 12px 0;
      border: none;
      background: transparent;
      font-size: 13px;
      font-weight: 600;
      color: #7a4a5a;
      cursor: pointer;
      transition: 0.2s;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
      border-top: 3px solid transparent;
    }

    .bottom-nav button .nav-icon {
      font-size: 22px;
    }

    .bottom-nav button.active {
      color: #d81b60;
      border-top-color: #d81b60;
      background: rgba(216, 27, 96, 0.05);
    }

    .bottom-nav button:hover {
      background: rgba(216, 27, 96, 0.05);
    }

    /* ----- Окно чата (открывается при клике на чат) ----- */
    .chat-window {
      display: none;
      flex-direction: column;
      height: 100%;
      background: rgba(255, 245, 247, 0.95);
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 10;
    }

    .chat-window.open {
      display: flex;
    }

    .chat-window-header {
      background: linear-gradient(135deg, #d81b60, #ad1457);
      padding: 14px 18px;
      color: white;
      display: flex;
      align-items: center;
      gap: 12px;
      flex-shrink: 0;
    }

    .chat-window-header .back-btn {
      background: rgba(255, 255, 255, 0.2);
      border: none;
      color: white;
      font-size: 20px;
      cursor: pointer;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: 0.2s;
    }

    .chat-window-header .back-btn:hover {
      background: rgba(255, 255, 255, 0.3);
    }

    .chat-window-header .chat-title {
      font-size: 18px;
      font-weight: 600;
    }

    .chat-window-header .chat-status {
      font-size: 12px;
      opacity: 0.8;
    }

    .chat-window .messages-area {
      flex: 1;
      padding: 16px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 4px;
      background: rgba(255, 240, 245, 0.1);
    }

    .chat-window .input-area {
      padding: 12px 16px 14px;
      background: rgba(255, 255, 255, 0.5);
      backdrop-filter: blur(4px);
      border-top: 1px solid rgba(255, 255, 255, 0.3);
      display: flex;
      gap: 8px;
      align-items: center;
      flex-shrink: 0;
    }

    .chat-window .input-area input[type="text"] {
      flex: 1;
      padding: 10px 16px;
      border: none;
      border-radius: 24px;
      background: white;
      font-size: 15px;
      outline: 2px solid transparent;
      transition: 0.2s;
    }

    .chat-window .input-area input[type="text"]:focus {
      outline: 2px solid #ec407a;
    }

    .chat-window .input-area button {
      background: linear-gradient(135deg, #d81b60, #ad1457);
      border: none;
      color: white;
      padding: 10px 20px;
      border-radius: 30px;
      font-weight: 600;
      font-size: 15px;
      cursor: pointer;
      transition: 0.2s;
      box-shadow: 0 4px 12px rgba(216, 27, 96, 0.25);
      white-space: nowrap;
    }

    .chat-window .input-area button:hover {
      transform: scale(1.02);
    }

    .chat-window .input-area .sticker-btn {
      background: rgba(216, 27, 96, 0.1);
      color: #d81b60;
      padding: 10px 14px;
      font-size: 20px;
      box-shadow: none;
    }

    .chat-window .input-area .sticker-btn:hover {
      background: rgba(216, 27, 96, 0.2);
    }

    /* Сообщения в чате (ягодный стиль) */
    .chat-window .message {
      max-width: 80%;
      padding: 10px 16px;
      border-radius: 24px 24px 24px 6px;
      background: white;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
      align-self: flex-start;
      word-break: break-word;
      border: 1px solid rgba(255, 255, 255, 0.5);
      animation: fadeUp 0.25s ease;
    }

    .chat-window .message.own {
      align-self: flex-end;
      background: linear-gradient(135deg, #f06292, #ec407a);
      color: white;
      border-radius: 24px 24px 6px 24px;
    }

    .chat-window .message .msg-user {
      font-weight: 600;
      font-size: 13px;
      color: #880e4f;
      margin-bottom: 2px;
      display: flex;
      justify-content: space-between;
      gap: 12px;
    }

    .chat-window .message.own .msg-user {
      color: #fce4ec;
    }

    .chat-window .message .msg-time {
      font-size: 10px;
      opacity: 0.7;
      font-weight: 400;
    }

    .chat-window .message .msg-text {
      font-size: 15px;
      line-height: 1.4;
    }

    .chat-window .message .sticker-emoji {
      font-size: 48px;
      display: block;
      text-align: center;
      padding: 4px 0;
    }

    /* Анимация */
    @keyframes fadeUp {
      0% { opacity: 0; transform: translateY(10px); }
      100% { opacity: 1; transform: translateY(0); }
    }

    /* Скролл */
    .chat-list::-webkit-scrollbar,
    .stickers-content::-webkit-scrollbar,
    .chat-window .messages-area::-webkit-scrollbar {
      width: 4px;
    }

    .chat-list::-webkit-scrollbar-thumb,
    .stickers-content::-webkit-scrollbar-thumb,
    .chat-window .messages-area::-webkit-scrollbar-thumb {
      background: #f06292;
      border-radius: 10px;
    }

    /* Адаптив */
    @media (max-width: 480px) {
      body {
        padding: 0;
      }
      .app-container {
        height: 100vh;
        max-height: none;
        border-radius: 0;
      }
      .stickers-grid {
        grid-template-columns: repeat(4, 1fr);
      }
    }
  </style>
</head>
<body>

<div class="app-container">
  <!-- Шапка -->
  <div class="app-header">
    <h1><span>🍓</span> Ягодка</h1>
    <div class="header-actions">
      <button id="clearAllBtn">🗑️ Очистить</button>
      <span id="unreadBadge" class="badge" style="display:none;">0</span>
    </div>
  </div>

  <!-- Основное содержимое -->
  <div class="main-content">
    <!-- Вкладка: Чаты -->
    <div class="tab-content active" id="tabChats">
      <div class="chat-list" id="chatList"></div>
    </div>

    <!-- Вкладка: Профиль -->
    <div class="tab-content" id="tabProfile">
      <div class="profile-content">
        <div class="profile-avatar">🍓</div>
        <div class="profile-name" id="profileName">Я</div>
        <div class="profile-status">🍒 Онлайн</div>

        <div class="profile-stats">
          <div class="stat">
            <div class="num" id="statMessages">0</div>
            <div class="label">Сообщений</div>
          </div>
          <div class="stat">
            <div class="num" id="statChats">0</div>
            <div class="label">Чатов</div>
          </div>
          <div class="stat">
            <div class="num" id="statStickers">0</div>
            <div class="label">Стикеров</div>
          </div>
        </div>

        <div class="profile-field">
          <span class="label">👤 Имя</span>
          <input type="text" id="profileUsername" placeholder="Ваше имя" maxlength="20" />
        </div>

        <div class="profile-field">
          <span class="label">🆔 ID</span>
          <span class="value" id="profileId">#yagodka-user</span>
        </div>

        <button class="profile-btn" id="profileSaveBtn">💾 Сохранить</button>
        <button class="profile-btn-outline" id="profileExportBtn">📤 Экспорт истории</button>
        <button class="profile-btn-outline" id="profileImportBtn" style="margin-top:4px;">📥 Импорт истории</button>
        <input type="file" id="importFileInput" accept=".json" style="display:none;" />
      </div>
    </div>

    <!-- Вкладка: Стикеры -->
    <div class="tab-content" id="tabStickers">
      <div class="stickers-content">
        <div class="sticker-category">🍓 Ягодные</div>
        <div class="stickers-grid" id="stickerGrid1"></div>

        <div class="sticker-category">😊 Смайлы</div>
        <div class="stickers-grid" id="stickerGrid2"></div>

        <div class="sticker-category">❤️ Сердечки</div>
        <div class="stickers-grid" id="stickerGrid3"></div>

        <div class="sticker-category">🎉 Праздничные</div>
        <div class="stickers-grid" id="stickerGrid4"></div>
      </div>
    </div>

    <!-- Окно чата -->
    <div class="chat-window" id="chatWindow">
      <div class="chat-window-header">
        <button class="back-btn" id="chatBackBtn">‹</button>
        <div>
          <div class="chat-title" id="chatWindowTitle">Чат</div>
          <div class="chat-status" id="chatWindowStatus">онлайн</div>
        </div>
      </div>
      <div class="messages-area" id="chatMessages"></div>
      <div class="input-area">
        <button class="sticker-btn" id="openStickersBtn">😊</button>
        <input type="text" id="chatInput" placeholder="Сообщение..." maxlength="300" />
        <button id="chatSendBtn">🍒 Отправить</button>
      </div>
    </div>
  </div>

  <!-- Нижняя навигация -->
  <div class="bottom-nav">
    <button class="active" data-tab="tabChats">
      <span class="nav-icon">💬</span>
      Чаты
    </button>
    <button data-tab="tabStickers">
      <span class="nav-icon">😊</span>
      Стикеры
    </button>
    <button data-tab="tabProfile">
      <span class="nav-icon">👤</span>
      Профиль
    </button>
  </div>
</div>

<script>
  (function() {
    // ----- Данные -----
    const STORAGE_KEY = 'yagodka_data';
    const USER_KEY = 'yagodka_username';

    // Коллекция стикеров
    const STICKERS = {
      'Ягодные': ['🍓', '🍒', '🫐', '🍇', '🍉', '🍊', '🍋', '🍌', '🍑', '🍎', '🍏', '🍐'],
      'Смайлы': ['😊', '😂', '😍', '🤩', '😎', '🤗', '😇', '🥰', '😘', '🤪', '😜', '🤭'],
      'Сердечки': ['❤️', '🧡', '💛', '💚', '💙', '💜', '🖤', '🤍', '💕', '💗', '💖', '💘'],
      'Праздничные': ['🎉', '🎊', '🎈', '🎁', '🎀', '✨', '🌟', '⭐', '🔥', '💫', '🌈', '🎵']
    };

    // ----- Элементы -----
    const chatList = document.getElementById('chatList');
    const chatWindow = document.getElementById('chatWindow');
    const chatMessages = document.getElementById('chatMessages');
    const chatInput = document.getElementById('chatInput');
    const chatSendBtn = document.getElementById('chatSendBtn');
    const chatBackBtn = document.getElementById('chatBackBtn');
    const chatWindowTitle = document.getElementById('chatWindowTitle');
    const chatWindowStatus = document.getElementById('chatWindowStatus');
    const openStickersBtn = document.getElementById('openStickersBtn');

    const usernameInput = document.getElementById('profileUsername');
    const profileName = document.getElementById('profileName');
    const profileId = document.getElementById('profileId');
    const statMessages = document.getElementById('statMessages');
    const statChats = document.getElementById('statChats');
    const statStickers = document.getElementById('statStickers');
    const unreadBadge = document.getElementById('unreadBadge');
    const clearAllBtn = document.getElementById('clearAllBtn');
    const profileSaveBtn = document.getElementById('profileSaveBtn');
    const profileExportBtn = document.getElementById('profileExportBtn');
    const profileImportBtn = document.getElementById('profileImportBtn');
    const importFileInput = document.getElementById('importFileInput');

    const navButtons = document.querySelectorAll('.bottom-nav button');
    const tabContents = {
      tabChats: document.getElementById('tabChats'),
      tabStickers: document.getElementById('tabStickers'),
      tabProfile: document.getElementById('tabProfile')
    };

    // ----- Загрузка данных -----
    let currentUser = localStorage.getItem(USER_KEY) || 'Я';
    let currentChat = null; // Имя чата, в котором мы сейчас

    function loadData() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        return raw ? JSON.parse(raw) : { chats: {}, unread: {} };
      } catch {
        return { chats: {}, unread: {} };
      }
    }

    function saveData(data) {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
    }

    function getChatMessages(chatName) {
      const data = loadData();
      if (!data.chats[chatName]) {
        data.chats[chatName] = [];
      }
      return data.chats[chatName];
    }

    function saveChatMessages(chatName, messages) {
      const data = loadData();
      data.chats[chatName] = messages;
      saveData(data);
    }

    function markAsRead(chatName) {
      const data = loadData();
      if (data.unread && data.unread[chatName]) {
        delete data.unread[chatName];
        saveData(data);
        updateUI();
      }
    }

    function getUnreadCount(chatName) {
      const data = loadData();
      return (data.unread && data.unread[chatName]) || 0;
    }

    function incrementUnread(chatName) {
      const data = loadData();
      if (!data.unread) data.unread = {};
      data.unread[chatName] = (data.unread[chatName] || 0) + 1;
      saveData(data);
      updateUI();
    }

    // ----- Создание чатов по умолчанию -----
    function initDefaultChats() {
      const data = loadData();
      const defaultChats = ['🍓 Ягодка', '🌸 Цветочки', '🌿 Зелёный', '☀️ Солнышко'];
      let changed = false;

      defaultChats.forEach(name => {
        if (!data.chats[name]) {
          data.chats[name] = [];
          changed = true;
          // Добавляем приветственное сообщение
          if (name === '🍓 Ягодка') {
            data.chats[name].push({ user: 'Ягодка', text: '🍓 Добро пожаловать в Ягодку!', timestamp: Date.now() - 60000 });
          } else {
            data.chats[name].push({ user: name, text: '👋 Привет! Как дела?', timestamp: Date.now() - 30000 });
          }
        }
      });

      if (changed) saveData(data);
    }

    initDefaultChats();

    // ----- Рендер списка чатов -----
    function renderChatList() {
      const data = loadData();
      const chatNames = Object.keys(data.chats);
      chatList.innerHTML = '';

      if (chatNames.length === 0) {
        chatList.innerHTML = `
          <div style="text-align:center;padding:40px 20px;color:#7a4a5a;">
            <div style="font-size:48px;margin-bottom:12px;">🍓</div>
            <div style="font-weight:600;font-size:18px;">Нет чатов</div>
            <div style="font-size:14px;opacity:0.7;">Создайте первый чат!</div>
          </div>
        `;
        return;
      }

      chatNames.forEach(name => {
        const messages = data.chats[name] || [];
        const lastMsg = messages[messages.length - 1];
        const unread = getUnreadCount(name);

        const div = document.createElement('div');
        div.className = 'chat-item';
        div.dataset.chat = name;

        const avatar = document.createElement('div');
        avatar.className = 'chat-avatar';
        avatar.textContent = name.charAt(0) || '💬';

        const info = document.createElement('div');
        info.className = 'chat-info';

        const nameSpan = document.createElement('div');
        nameSpan.className = 'chat-name';
        nameSpan.textContent = name;

        const lastMsgSpan = document.createElement('div');
        lastMsgSpan.className = 'chat-last-msg';
        lastMsgSpan.textContent = lastMsg ? lastMsg.text : 'Нет сообщений';

        info.appendChild(nameSpan);
        info.appendChild(lastMsgSpan);

        const meta = document.createElement('div');
        meta.className = 'chat-meta';

        const timeSpan = document.createElement('div');
        timeSpan.className = 'chat-time';
        timeSpan.textContent = lastMsg ? formatTime(lastMsg.timestamp) : '';

        meta.appendChild(timeSpan);

        if (unread > 0) {
          const badge = document.createElement('div');
          badge.className = 'chat-unread';
          badge.textContent = unread;
          meta.appendChild(badge);
        }

        div.appendChild(avatar);
        div.appendChild(info);
        div.appendChild(meta);

        div.addEventListener('click', () => openChat(name));

        chatList.appendChild(div);
      });

      updateUnreadBadge();
    }

    // ----- Форматирование времени -----
    function formatTime(timestamp) {
      if (!timestamp) return '';
      const date = new Date(timestamp);
      return date.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    }

    function formatDate(timestamp) {
      const date = new Date(timestamp);
      const now = new Date();
      const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
      const yesterday = new Date(today);
      yesterday.setDate(yesterday.getDate() - 1);

      const msgDate = new Date(date.getFullYear(), date.getMonth(), date.getDate());

      if (msgDate.getTime() === today.getTime()) return 'Сегодня';
      if (msgDate.getTime() === yesterday.getTime()) return 'Вчера';
      return date.toLocaleDateString('ru-RU', { day: 'numeric', month: 'long' });
    }

    // ----- Открыть чат -----
    function openChat(chatName) {
      currentChat = chatName;
      chatWindow.classList.add('open');
      chatWindowTitle.textContent = chatName;
      chatWindowStatus.textContent = 'онлайн';

      markAsRead(chatName);
      renderChatMessages(chatName);
      chatInput.focus();
      updateUI();
    }

    function closeChat() {
      chatWindow.classList.remove('open');
      currentChat = null;
      renderChatList();
    }

    // ----- Рендер сообщений чата -----
    function renderChatMessages(chatName) {
      const messages = getChatMessages(chatName);
      chatMessages.innerHTML = '';

      let lastDate = '';

      messages.forEach((msg) => {
        const msgDate = formatDate(msg.timestamp || Date.now());

        if (msgDate !== lastDate) {
          const divider = document.createElement('div');
          divider.style.cssText = 'text-align:center;font-size:11px;color:#7a4a5a;padding:8px 0 4px;';
          divider.innerHTML = `<span style="background:rgba(255,255,255,0.5);padding:2px 14px;border-radius:20px;">${msgDate}</span>`;
          chatMessages.appendChild(divider);
          lastDate = msgDate;
        }

        const isOwn = msg.user === currentUser || (msg.user === 'Я');
        const div = document.createElement('div');
        div.className = `message ${isOwn ? 'own' : ''}`;

        const userSpan = document.createElement('div');
        userSpan.className = 'msg-user';
        userSpan.innerHTML = `
          <span>${escapeHtml(msg.user)}</span>
          <span class="msg-time">${formatTime(msg.timestamp)}</span>
        `;

        const textSpan = document.createElement('div');
        textSpan.className = 'msg-text';

        // Проверяем, стикер ли это (один эмодзи в сообщении)
        if (msg.text && msg.text.length <= 2 && isEmoji(msg.text)) {
          textSpan.className = 'sticker-emoji';
          textSpan.textContent = msg.text;
        } else {
          textSpan.textContent = msg.text;
        }

        div.appendChild(userSpan);
        div.appendChild(textSpan);
        chatMessages.appendChild(div);
      });

      chatMessages.scrollTop = chatMessages.scrollHeight;
    }

    function isEmoji(str) {
      const emojiRegex = /^[\u{1F000}-\u{1FFFF}]|[\u2600-\u27BF]|[\u{FE00}-\u{FEFF}]|[\u{1F600}-\u{1F64F}]|[\u{1F300}-\u{1F5FF}]|[\u{1F680}-\u{1F6FF}]|[\u{1F700}-\u{1F77F}]|[\u{1F780}-\u{1F7FF}]|[\u{1F800}-\u{1F8FF}]|[\u{1F900}-\u{1F9FF}]|[\u{1FA00}-\u{1FA6F}]|[\u{1FA70}-\u{1FAFF}]|[\u{2700}-\u{27BF}]|[\u{2600}-\u{26FF}]|[\u{2300}-\u{23FF}]$/u;
      return emojiRegex.test(str);
    }

    function escapeHtml(str) {
      const div = document.createElement('div');
      div.textContent = str;
      return div.innerHTML;
    }

    // ----- Отправка сообщения -----
    function sendMessageToChat(chatName) {
      const text = chatInput.value.trim();
      if (!text) return;

      const messages = getChatMessages(chatName);
      messages.push({
        user: currentUser || 'Я',
        text: text,
        timestamp: Date.now()
      });
      saveChatMessages(chatName, messages);

      chatInput.value = '';
      renderChatMessages(chatName);
      updateUI();

      // Если мы не в этом чате, увеличиваем счётчик непрочитанных
      if (currentChat !== chatName) {
        incrementUnread(chatName);
      }
    }

    // ----- Отправка стикера -----
    function sendSticker(chatName, sticker) {
      const messages = getChatMessages(chatName);
      messages.push({
        user: currentUser || 'Я',
        text: sticker,
        timestamp: Date.now()
      });
      saveChatMessages(chatName, messages);
      renderChatMessages(chatName);
      updateUI();

      if (currentChat !== chatName) {
        incrementUnread(chatName);
      }
    }

    // ----- Рендер стикеров -----
    function renderStickers() {
      const gridIds = ['stickerGrid1', 'stickerGrid2', 'stickerGrid3', 'stickerGrid4'];
      const categories = Object.keys(STICKERS);

      categories.forEach((cat, idx) => {
        const grid = document.getElementById(gridIds[idx]);
        if (!grid) return;
        grid.innerHTML = '';
        STICKERS[cat].forEach(sticker => {
          const div = document.createElement('div');
          div.className = 'sticker-item';
          div.textContent = sticker;
          div.addEventListener('click', () => {
            if (currentChat) {
              sendSticker(currentChat, sticker);
            } else {
              // Если чат не открыт, отправляем в первый чат
              const data = loadData();
              const chatNames = Object.keys(data.chats);
              if (chatNames.length > 0) {
                sendSticker(chatNames[0], sticker);
                openChat(chatNames[0]);
              } else {
                alert('Сначала создайте чат!');
              }
            }
          });
          grid.appendChild(div);
        });
      });
    }

    // ----- Обновление UI (профиль, статистика, бейджи) -----
    function updateUI() {
      const data = loadData();
      const chatNames = Object.keys(data.chats);
      let totalMessages = 0;
      chatNames.forEach(name => {
        totalMessages += (data.chats[name] || []).length;
      });

      statMessages.textContent = totalMessages;
      statChats.textContent = chatNames.length;
      statStickers.textContent = Object.values(STICKERS).flat().length;

      profileName.textContent = currentUser;
      usernameInput.value = currentUser;
      profileId.textContent = '#yagodka-' + currentUser.toLowerCase().replace(/[^a-zа-я]/g, '');

      renderChatList();
      updateUnreadBadge();
    }

    function updateUnreadBadge() {
      const data = loadData();
      const unread = data.unread || {};
      const total = Object.values(unread).reduce((sum, val) => sum + val, 0);
      if (total > 0) {
        unreadBadge.style.display = 'inline';
        unreadBadge.textContent = total > 9 ? '9+' : total;
      } else {
        unreadBadge.style.display = 'none';
      }
    }

    // ----- Очистка всех чатов -----
    function clearAllChats() {
      if (confirm('🧹 Очистить все чаты?')) {
        const data = loadData();
        const chatNames = Object.keys(data.chats);
        chatNames.forEach(name => {
          data.chats[name] = [];
        });
        data.unread = {};
        saveData(data);
        if (currentChat) {
          renderChatMessages(currentChat);
        }
        updateUI();
      }
    }

    // ----- Экспорт истории -----
    function exportHistory() {
      const data = loadData();
      const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `yagodka_history_${new Date().toISOString().slice(0,10)}.json`;
      a.click();
      URL.revokeObjectURL(url);
    }

    // ----- Импорт истории -----
    function importHistory(file) {
      const reader = new FileReader();
      reader.onload = (e) => {
        try {
          const data = JSON.parse(e.target.result);
          if (data.chats && typeof data.chats === 'object') {
            saveData(data);
            if (currentChat) {
              renderChatMessages(currentChat);
            }
            updateUI();
            alert('✅ История успешно импортирована!');
          } else {
            alert('❌ Неверный формат файла');
          }
        } catch (err) {
          alert('❌ Ошибка при импорте: ' + err.message);
        }
      };
      reader.readAsText(file);
    }

    // ----- Навигация (вкладки) -----
    function switchTab(tabId) {
      // Скрыть все вкладки
      Object.keys(tabContents).forEach(key => {
        tabContents[key].classList.remove('active');
      });
      // Показать нужную
      if (tabContents[tabId]) {
        tabContents[tabId].classList.add('active');
      }
      // Обновить кнопки
      navButtons.forEach(btn => {
        btn.classList.toggle('active', btn.dataset.tab === tabId);
      });
    }

    navButtons.forEach(btn => {
      btn.addEventListener('click', () => {
        const tabId = btn.dataset.tab;
        if (tabId) {
          switchTab(tabId);
        }
      });
    });

    // ----- Обработчики -----
    chatSendBtn.addEventListener('click', () => {
      if (currentChat) sendMessageToChat(currentChat);
    });

    chatInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && currentChat) {
        e.preventDefault();
        sendMessageToChat(currentChat);
      }
    });

    chatBackBtn.addEventListener('click', closeChat);

    openStickersBtn.addEventListener('click', () => {
      switchTab('tabStickers');
    });

    clearAllBtn.addEventListener('click', clearAllChats);

    profileSaveBtn.addEventListener('click', () => {
      const val = usernameInput.value.trim() || 'Я';
      currentUser = val;
      localStorage.setItem(USER_KEY, val);
      updateUI();
      if (currentChat) renderChatMessages(currentChat);
    });

    usernameInput.addEventListener('change', () => {
      const val = usernameInput.value.trim() || 'Я';
      currentUser = val;
      localStorage.setItem(USER_KEY, val);
      updateUI();
      if (currentChat) renderChatMessages(currentChat);
    });

    profileExportBtn.addEventListener('click', exportHistory);

    profileImportBtn.addEventListener('click', () => {
      importFileInput.click();
    });

    importFileInput.addEventListener('change', (e) => {
      if (e.target.files.length > 0) {
        importHistory(e.target.files[0]);
        e.target.value = '';
      }
    });

    // ----- Инициализация -----
    renderStickers();
    updateUI();

    // Открываем первый чат по умолчанию
    const data = loadData();
    const chatNames = Object.keys(data.chats);
    if (chatNames.length > 0) {
      openChat(chatNames[0]);
    }

    // Обновляем при изменении в других вкладках
    window.addEventListener('storage', (e) => {
      if (e.key === STORAGE_KEY || e.key === USER_KEY) {
        if (e.key === USER_KEY) {
          currentUser = e.newValue || 'Я';
        }
        updateUI();
        if (currentChat) renderChatMessages(currentChat);
      }
    });

  })();
</script>
</body>
</html>
