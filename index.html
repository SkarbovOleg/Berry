<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>🍓 Ягодка — Общий чат</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Roboto, system-ui, sans-serif;
        }

        body {
            background: linear-gradient(145deg, #fce4ec 0%, #f8bbd0 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .app-container {
            max-width: 700px;
            width: 100%;
            height: 92vh;
            max-height: 750px;
            background: rgba(255, 245, 247, 0.92);
            backdrop-filter: blur(8px);
            border-radius: 32px;
            box-shadow: 0 20px 60px rgba(180, 60, 80, 0.25);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            border: 2px solid rgba(255, 255, 255, 0.5);
        }

        /* Шапка */
        .header {
            background: linear-gradient(135deg, #d81b60, #ad1457);
            padding: 14px 20px;
            color: white;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-shrink: 0;
            border-bottom: 3px solid #f06292;
            flex-wrap: wrap;
            gap: 8px;
        }

        .header h1 {
            font-size: 20px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .header h1 span {
            font-size: 24px;
        }

        .header .status {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
            background: rgba(255,255,255,0.15);
            padding: 4px 14px;
            border-radius: 30px;
        }

        .dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            display: inline-block;
        }

        .dot.online { background: #4caf50; }
        .dot.offline { background: #888; }
        .dot.connecting { background: #ff9800; animation: blink 0.5s infinite; }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }

        .user-name {
            font-weight: 600;
            font-size: 14px;
        }

        .users-online {
            font-size: 12px;
            opacity: 0.8;
        }

        /* Сообщения */
        .messages-area {
            flex: 1;
            padding: 16px 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 2px;
            background: rgba(255, 245, 247, 0.15);
        }

        .message {
            max-width: 80%;
            padding: 8px 14px;
            border-radius: 18px 18px 18px 4px;
            background: white;
            box-shadow: 0 1px 4px rgba(0,0,0,0.05);
            align-self: flex-start;
            word-break: break-word;
            animation: fadeUp 0.2s ease;
        }

        .message.own {
            align-self: flex-end;
            background: linear-gradient(135deg, #f06292, #ec407a);
            color: white;
            border-radius: 18px 18px 4px 18px;
        }

        .message .user {
            font-size: 11px;
            font-weight: 600;
            color: #880e4f;
            margin-bottom: 1px;
        }

        .message.own .user {
            color: #fce4ec;
        }

        .message .time {
            font-size: 9px;
            opacity: 0.6;
            margin-left: 8px;
        }

        .message .text {
            font-size: 15px;
            line-height: 1.4;
        }

        .message .sticker {
            font-size: 40px;
            display: block;
            text-align: center;
            padding: 2px 0;
        }

        .message.system {
            align-self: center;
            background: rgba(255,255,255,0.3);
            border: none;
            font-size: 11px;
            color: #7a4a5a;
            padding: 3px 16px;
            border-radius: 30px;
            max-width: 90%;
        }

        .message.system .text {
            font-size: 11px;
        }

        @keyframes fadeUp {
            0% { opacity: 0; transform: translateY(8px); }
            100% { opacity: 1; transform: translateY(0); }
        }

        /* Ввод */
        .input-area {
            padding: 10px 20px 14px;
            background: rgba(255,255,255,0.3);
            backdrop-filter: blur(4px);
            border-top: 1px solid rgba(255,255,255,0.3);
            display: flex;
            gap: 8px;
            align-items: center;
            flex-shrink: 0;
        }

        .input-area input {
            flex: 1;
            padding: 10px 16px;
            border: none;
            border-radius: 28px;
            background: white;
            font-size: 15px;
            outline: 2px solid transparent;
            transition: 0.2s;
        }

        .input-area input:focus {
            outline: 2px solid #ec407a;
        }

        .input-area input:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .input-area button {
            background: linear-gradient(135deg, #d81b60, #ad1457);
            border: none;
            color: white;
            padding: 10px 18px;
            border-radius: 28px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
        }

        .input-area button:hover:not(:disabled) {
            transform: scale(1.02);
        }

        .input-area button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .sticker-btn {
            background: rgba(216,27,96,0.1) !important;
            color: #d81b60 !important;
            padding: 10px 12px !important;
            font-size: 20px !important;
            box-shadow: none !important;
            min-width: 44px;
        }

        .sticker-btn:hover:not(:disabled) {
            background: rgba(216,27,96,0.2) !important;
        }

        /* Стикеры */
        .sticker-panel {
            display: none;
            padding: 12px 20px;
            background: rgba(255,255,255,0.2);
            border-top: 1px solid rgba(255,255,255,0.2);
            flex-shrink: 0;
        }

        .sticker-panel.active {
            display: block;
        }

        .sticker-grid {
            display: grid;
            grid-template-columns: repeat(8, 1fr);
            gap: 4px;
        }

        .sticker-grid .sticker {
            aspect-ratio: 1;
            background: rgba(255,255,255,0.4);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            cursor: pointer;
            transition: 0.2s;
            border: 2px solid transparent;
        }

        .sticker-grid .sticker:hover {
            transform: scale(1.1);
            border-color: #d81b60;
            background: rgba(255,255,255,0.7);
        }

        /* Скролл */
        .messages-area::-webkit-scrollbar {
            width: 4px;
        }
        .messages-area::-webkit-scrollbar-thumb {
            background: #f06292;
            border-radius: 10px;
        }

        /* Адаптив */
        @media (max-width: 500px) {
            body { padding: 8px; }
            .app-container { height: 98vh; max-height: none; border-radius: 16px; }
            .message { max-width: 90%; }
            .header h1 { font-size: 16px; }
            .sticker-grid { grid-template-columns: repeat(6, 1fr); }
            .sticker-grid .sticker { font-size: 22px; }
        }
    </style>
</head>
<body>

<div class="app-container">
    <!-- Шапка -->
    <div class="header">
        <h1><span>🍓</span> Ягодка</h1>
        <div>
            <span class="user-name" id="userNameDisplay">загрузка...</span>
            <span class="status">
                <span class="dot offline" id="statusDot"></span>
                <span id="statusText">офлайн</span>
                <span class="users-online" id="usersCount"></span>
            </span>
        </div>
    </div>

    <!-- Сообщения -->
    <div class="messages-area" id="messagesArea">
        <div class="message system">
            <div class="text">🍓 Добро пожаловать в общий чат!</div>
        </div>
        <div class="message system">
            <div class="text">⏳ Подключение к сети...</div>
        </div>
    </div>

    <!-- Стикеры -->
    <div class="sticker-panel" id="stickerPanel">
        <div class="sticker-grid" id="stickerGrid"></div>
    </div>

    <!-- Ввод -->
    <div class="input-area">
        <button class="sticker-btn" id="stickerToggleBtn">😊</button>
        <input type="text" id="messageInput" placeholder="Напишите сообщение..." disabled />
        <button id="sendBtn" disabled>🍒</button>
    </div>
</div>

<script>
    // ============================================================
    // 🍓 Ягодка — Общий чат без ввода ID
    // Автоматическое подключение через комнату
    // ============================================================

    // --- Стикеры ---
    const STICKERS = ['🍓', '🍒', '🫐', '🍇', '🍉', '🍊', '🍋', '😊', '😂', '😍', '🤩', '🥰', '😘', '❤️', '🧡', '💛', '💚', '💙', '💜', '🎉', '🎊', '✨', '🌟', '🔥'];

    // --- Конфиг ---
    const ROOM_ID = 'yagodka-chat-room'; // Общая комната для всех

    // --- Состояние ---
    let peer = null;
    let myId = null;
    let userName = '';
    let connections = {};
    let isConnected = false;
    let reconnectAttempts = 0;
    const MAX_RECONNECT = 5;

    // --- DOM ---
    const messagesArea = document.getElementById('messagesArea');
    const messageInput = document.getElementById('messageInput');
    const sendBtn = document.getElementById('sendBtn');
    const stickerToggleBtn = document.getElementById('stickerToggleBtn');
    const stickerPanel = document.getElementById('stickerPanel');
    const stickerGrid = document.getElementById('stickerGrid');
    const userNameDisplay = document.getElementById('userNameDisplay');
    const statusDot = document.getElementById('statusDot');
    const statusText = document.getElementById('statusText');
    const usersCount = document.getElementById('usersCount');

    // --- Генерация имени ---
    function generateName() {
        const adjectives = ['весёлый', 'добрый', 'умный', 'красивый', 'смелый', 'яркий', 'милый', 'крутой', 'забавный', 'нежный'];
        const nouns = ['ягодка', 'ёжик', 'зайка', 'мишка', 'солнышко', 'цветочек', 'дракончик', 'котик', 'лисичка', 'белочка'];
        const adj = adjectives[Math.floor(Math.random() * adjectives.length)];
        const noun = nouns[Math.floor(Math.random() * nouns.length)];
        return `${adj}_${noun}`;
    }

    // --- Инициализация Peer ---
    function initPeer() {
        // Генерируем имя
        userName = generateName();
        userNameDisplay.textContent = userName;

        // Создаём Peer
        peer = new Peer({
            debug: 0
        });

        // Готов
        peer.on('open', (id) => {
            console.log('✅ Peer готов:', id);
            myId = id;
            userNameDisplay.textContent = `${userName} (${id.slice(0, 6)})`;
            updateStatus('connecting', 'подключение...');
            
            // Подключаемся к комнате
            joinRoom();
        });

        // Входящее соединение
        peer.on('connection', (conn) => {
            console.log('📞 Входящее от:', conn.peer);
            setupConnection(conn);
        });

        // Ошибка
        peer.on('error', (err) => {
            console.error('❌ Ошибка Peer:', err);
            if (err.type === 'peer-unavailable') {
                // Игнорируем — такой ID не существует
            } else if (err.type === 'unavailable-id') {
                // ID занят — пробуем другой
                peer.destroy();
                setTimeout(initPeer, 1000);
            } else {
                updateStatus('offline', 'ошибка');
                if (reconnectAttempts < MAX_RECONNECT) {
                    reconnectAttempts++;
                    setTimeout(initPeer, 3000);
                }
            }
        });

        // Закрытие
        peer.on('close', () => {
            console.log('🔌 Peer закрыт');
            updateStatus('offline', 'офлайн');
            isConnected = false;
            connections = {};
            updateUsersCount();
            
            if (reconnectAttempts < MAX_RECONNECT) {
                reconnectAttempts++;
                setTimeout(initPeer, 3000);
            }
        });
    }

    // --- Подключение к комнате ---
    function joinRoom() {
        // Создаём фейковый ID для комнаты
        // Используем хеш от ROOM_ID
        let hash = 0;
        for (let i = 0; i < ROOM_ID.length; i++) {
            hash = ((hash << 5) - hash) + ROOM_ID.charCodeAt(i);
            hash = hash & hash;
        }
        const roomPeerId = `yagodka-room-${Math.abs(hash).toString(36)}`;
        
        console.log('🏠 Подключение к комнате:', roomPeerId);
        
        // Пытаемся подключиться к комнате
        try {
            const conn = peer.connect(roomPeerId);
            if (conn) {
                setupConnection(conn);
            }
        } catch (err) {
            console.log('ℹ️ Комната ещё не создана, создаём...');
            // Создаём комнату (она создаётся автоматически при первом подключении)
            // Ждём, пока кто-то подключится
            addSystemMessage('🍓 Вы первый в чате! Ожидаем других...');
            updateStatus('online', 'онлайн');
            isConnected = true;
            messageInput.disabled = false;
            sendBtn.disabled = false;
        }

        // Также пытаемся подключиться к другим известным узлам
        // Для этого используем простой подход: каждый подключается к комнате
        // и через неё узнаёт о других
        setTimeout(() => {
            discoverPeers();
        }, 1000);
    }

    // --- Поиск других пользователей ---
    function discoverPeers() {
        // В PeerJS нет встроенного списка всех пользователей
        // Поэтому мы используем подход: каждый подключается к "комнате"
        // и рассылает сообщение о себе
        
        // Отправляем сообщение о себе
        const announceMsg = {
            type: 'announce',
            sender: myId,
            name: userName,
            timestamp: Date.now()
        };

        // Отправляем всем известным
        broadcast(announceMsg);
        
        updateStatus('online', 'онлайн');
        isConnected = true;
        messageInput.disabled = false;
        sendBtn.disabled = false;
        
        // Если есть подключения, добавляем системное сообщение
        const peers = Object.keys(connections);
        if (peers.length > 0) {
            addSystemMessage(`👥 В чате ${peers.length + 1} человек`);
        } else {
            addSystemMessage('🍓 Вы в чате! Пригласите друзей — откройте эту же страницу');
        }
        
        updateUsersCount();
    }

    // --- Настройка соединения ---
    function setupConnection(conn) {
        const peerId = conn.peer;
        
        if (connections[peerId]) {
            // Уже есть соединение
            return;
        }

        connections[peerId] = conn;

        // Обработка данных
        conn.on('data', (data) => {
            handleMessage(data, peerId);
        });

        // Закрытие
        conn.on('close', () => {
            console.log('🔌 Соединение закрыто:', peerId);
            delete connections[peerId];
            updateUsersCount();
            
            // Показываем, кто вышел
            const name = conn._data?.name || peerId;
            addSystemMessage(`👋 ${name} покинул чат`);
        });

        // Ошибка
        conn.on('error', (err) => {
            console.error('Ошибка соединения:', err);
            delete connections[peerId];
            updateUsersCount();
        });

        // Отправляем информацию о себе
        conn.send({
            type: 'announce',
            sender: myId,
            name: userName,
            timestamp: Date.now()
        });

        updateUsersCount();
        addSystemMessage(`✅ ${peerId} присоединился к чату`);
    }

    // --- Обработка сообщений ---
    function handleMessage(data, senderId) {
        if (data.type === 'message') {
            addMessage(data.text, data.name || data.sender || senderId);
        } else if (data.type === 'sticker') {
            addSticker(data.emoji, data.name || data.sender || senderId);
        } else if (data.type === 'system') {
            addSystemMessage(data.text);
        } else if (data.type === 'announce') {
            // Кто-то объявил о себе
            const name = data.name || data.sender;
            if (data.sender !== myId && !connections[data.sender]) {
                // Пытаемся подключиться к этому пользователю
                try {
                    const conn = peer.connect(data.sender);
                    if (conn) {
                        setupConnection(conn);
                    }
                } catch (err) {
                    // Игнорируем
                }
            }
        } else {
            addMessage(data.text || data, senderId);
        }
    }

    // --- Отправка сообщения ---
    function sendMessage(text) {
        if (!text || text.trim() === '') return;

        const msg = {
            type: 'message',
            text: text.trim(),
            sender: myId,
            name: userName,
            timestamp: Date.now()
        };

        // Отправляем всем
        broadcast(msg);
        
        // Добавляем в свой чат
        addMessage(text.trim(), userName, true);
    }

    // --- Отправка стикера ---
    function sendSticker(emoji) {
        const msg = {
            type: 'sticker',
            emoji: emoji,
            sender: myId,
            name: userName,
            timestamp: Date.now()
        };

        broadcast(msg);
        addSticker(emoji, userName, true);
    }

    // --- Рассылка всем ---
    function broadcast(data) {
        const peers = Object.keys(connections);
        if (peers.length === 0) {
            return;
        }

        peers.forEach(peerId => {
            try {
                connections[peerId].send(data);
            } catch (err) {
                console.error('Ошибка отправки:', err);
                delete connections[peerId];
            }
        });
        
        updateUsersCount();
    }

    // --- Добавление сообщения в UI ---
    function addMessage(text, user, isOwn = false) {
        const div = document.createElement('div');
        div.className = `message ${isOwn ? 'own' : ''}`;

        const userSpan = document.createElement('div');
        userSpan.className = 'user';
        userSpan.textContent = user;

        const timeSpan = document.createElement('span');
        timeSpan.className = 'time';
        timeSpan.textContent = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
        userSpan.appendChild(timeSpan);

        const textSpan = document.createElement('div');
        textSpan.className = 'text';
        textSpan.textContent = text;

        div.appendChild(userSpan);
        div.appendChild(textSpan);

        messagesArea.appendChild(div);
        messagesArea.scrollTop = messagesArea.scrollHeight;
    }

    function addSticker(emoji, user, isOwn = false) {
        const div = document.createElement('div');
        div.className = `message ${isOwn ? 'own' : ''}`;

        const userSpan = document.createElement('div');
        userSpan.className = 'user';
        userSpan.textContent = user;

        const timeSpan = document.createElement('span');
        timeSpan.className = 'time';
        timeSpan.textContent = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
        userSpan.appendChild(timeSpan);

        const stickerSpan = document.createElement('div');
        stickerSpan.className = 'sticker';
        stickerSpan.textContent = emoji;

        div.appendChild(userSpan);
        div.appendChild(stickerSpan);

        messagesArea.appendChild(div);
        messagesArea.scrollTop = messagesArea.scrollHeight;
    }

    function addSystemMessage(text) {
        // Убираем "Подключение..." если есть
        const systemMessages = messagesArea.querySelectorAll('.message.system');
        systemMessages.forEach(el => {
            if (el.textContent.includes('Подключение')) {
                el.remove();
            }
        });

        const div = document.createElement('div');
        div.className = 'message system';
        div.innerHTML = `<div class="text">${text}</div>`;
        messagesArea.appendChild(div);
        messagesArea.scrollTop = messagesArea.scrollHeight;
    }

    // --- Обновление статуса ---
    function updateStatus(state, text) {
        statusDot.className = `dot ${state}`;
        statusText.textContent = text;
    }

    // --- Обновление счётчика пользователей ---
    function updateUsersCount() {
        const count = Object.keys(connections).length;
        if (count > 0) {
            usersCount.textContent = `👥 ${count}`;
        } else {
            usersCount.textContent = '';
        }
    }

    // --- Стикеры ---
    function initStickers() {
        stickerGrid.innerHTML = '';
        STICKERS.forEach(emoji => {
            const div = document.createElement('div');
            div.className = 'sticker';
            div.textContent = emoji;
            div.addEventListener('click', () => {
                if (isConnected) {
                    sendSticker(emoji);
                    stickerPanel.classList.remove('active');
                    stickerToggleBtn.textContent = '😊';
                } else {
                    addSystemMessage('⏳ Подождите подключения к сети');
                }
            });
            stickerGrid.appendChild(div);
        });
    }

    // --- Обработчики ---
    sendBtn.addEventListener('click', () => {
        const text = messageInput.value.trim();
        if (text && isConnected) {
            sendMessage(text);
            messageInput.value = '';
        } else if (!isConnected) {
            addSystemMessage('⏳ Подождите подключения к сети');
        }
    });

    messageInput.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' && !e.shiftKey) {
            e.preventDefault();
            sendBtn.click();
        }
    });

    stickerToggleBtn.addEventListener('click', () => {
        stickerPanel.classList.toggle('active');
        stickerToggleBtn.textContent = stickerPanel.classList.contains('active') ? '✕' : '😊';
    });

    // --- Запуск ---
    initPeer();
    initStickers();

    console.log('🍓 Ягодка Общий чат запущен!');
    console.log('👤 Имя:', userName);
    console.log('📌 Просто откройте эту страницу — и вы в чате!');

    // Периодическое обновление (keep-alive)
    setInterval(() => {
        if (isConnected && Object.keys(connections).length > 0) {
            broadcast({ type: 'ping', timestamp: Date.now() });
        }
    }, 30000);
</script>
</body>
</html>
