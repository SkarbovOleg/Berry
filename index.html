<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>🍓 Ягодка P2P</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Roboto, system-ui, sans-serif;
        }

        body {
            background: linear-gradient(145deg, #fce4ec 0%, #f8bbd0 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .app-container {
            max-width: 900px;
            width: 100%;
            height: 92vh;
            max-height: 750px;
            background: rgba(255, 245, 247, 0.92);
            backdrop-filter: blur(8px);
            border-radius: 32px;
            box-shadow: 0 20px 60px rgba(180, 60, 80, 0.25);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            border: 2px solid rgba(255, 255, 255, 0.5);
        }

        /* Шапка */
        .header {
            background: linear-gradient(135deg, #d81b60, #ad1457);
            padding: 14px 24px;
            color: white;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-shrink: 0;
            border-bottom: 3px solid #f06292;
            flex-wrap: wrap;
            gap: 8px;
        }

        .header h1 {
            font-size: 22px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .header h1 span {
            font-size: 26px;
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }

        .header-right .my-id {
            background: rgba(255, 255, 255, 0.2);
            padding: 4px 16px;
            border-radius: 30px;
            font-size: 13px;
            font-weight: 500;
            font-family: monospace;
        }

        .status-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            display: inline-block;
            margin-right: 4px;
        }

        .status-dot.online {
            background: #4caf50;
        }
        .status-dot.offline {
            background: #888;
        }
        .status-dot.connecting {
            background: #ff9800;
            animation: blink 0.5s infinite;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }

        /* Основное содержимое */
        .main-content {
            flex: 1;
            display: flex;
            overflow: hidden;
        }

        /* Левая панель - контакты */
        .sidebar {
            width: 280px;
            min-width: 220px;
            background: rgba(255, 240, 245, 0.3);
            border-right: 1px solid rgba(255, 255, 255, 0.3);
            display: flex;
            flex-direction: column;
            padding: 16px;
            gap: 12px;
        }

        .sidebar h3 {
            font-size: 14px;
            color: #7a4a5a;
            font-weight: 600;
            letter-spacing: 0.5px;
        }

        .contact-input-area {
            display: flex;
            gap: 8px;
        }

        .contact-input-area input {
            flex: 1;
            padding: 8px 14px;
            border: 2px solid rgba(216, 27, 96, 0.2);
            border-radius: 24px;
            font-size: 14px;
            outline: none;
            transition: 0.2s;
            background: rgba(255, 255, 255, 0.7);
        }

        .contact-input-area input:focus {
            border-color: #d81b60;
            background: white;
        }

        .contact-input-area button {
            padding: 8px 16px;
            border: none;
            border-radius: 24px;
            background: linear-gradient(135deg, #d81b60, #ad1457);
            color: white;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
            white-space: nowrap;
        }

        .contact-input-area button:hover {
            transform: scale(1.02);
        }

        .contact-input-area button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        /* Мои контакты */
        .contact-list {
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .contact-item {
            padding: 10px 14px;
            background: rgba(255, 255, 255, 0.5);
            border-radius: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: 0.2s;
            border: 1px solid transparent;
        }

        .contact-item.active {
            border-color: #d81b60;
            background: rgba(216, 27, 96, 0.08);
        }

        .contact-item .name {
            font-weight: 600;
            color: #2a0a1a;
            font-size: 14px;
        }

        .contact-item .status {
            font-size: 12px;
            color: #7a4a5a;
        }

        .contact-item .status.online {
            color: #4caf50;
        }

        .status-badge {
            font-size: 11px;
            padding: 2px 10px;
            border-radius: 20px;
            background: #eee;
            color: #888;
        }

        .status-badge.online {
            background: #e8f5e9;
            color: #2e7d32;
        }

        .status-badge.offline {
            background: #f5f5f5;
            color: #999;
        }

        /* Центральная панель - чат */
        .chat-panel {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: rgba(255, 245, 247, 0.2);
        }

        .chat-header {
            padding: 12px 20px;
            background: rgba(255, 255, 255, 0.4);
            border-bottom: 1px solid rgba(255, 255, 255, 0.3);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-shrink: 0;
        }

        .chat-header .chat-with {
            font-weight: 600;
            color: #2a0a1a;
            font-size: 16px;
        }

        .chat-header .chat-status {
            font-size: 13px;
            color: #7a4a5a;
        }

        .messages-area {
            flex: 1;
            padding: 16px 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .message {
            max-width: 75%;
            padding: 8px 14px;
            border-radius: 18px 18px 18px 4px;
            background: white;
            box-shadow: 0 1px 4px rgba(0,0,0,0.05);
            align-self: flex-start;
            word-break: break-word;
            animation: fadeUp 0.25s ease;
            border: 1px solid rgba(255,255,255,0.3);
        }

        .message.own {
            align-self: flex-end;
            background: linear-gradient(135deg, #f06292, #ec407a);
            color: white;
            border-radius: 18px 18px 4px 18px;
        }

        .message .user {
            font-size: 12px;
            font-weight: 600;
            color: #880e4f;
            margin-bottom: 2px;
        }

        .message.own .user {
            color: #fce4ec;
        }

        .message .time {
            font-size: 10px;
            opacity: 0.6;
            margin-left: 10px;
        }

        .message .text {
            font-size: 15px;
            line-height: 1.4;
        }

        .message .sticker {
            font-size: 44px;
            display: block;
            text-align: center;
            padding: 4px 0;
        }

        .message.system {
            align-self: center;
            background: rgba(255,255,255,0.3);
            border: none;
            font-size: 12px;
            color: #7a4a5a;
            padding: 4px 16px;
            border-radius: 30px;
            max-width: 90%;
        }

        .message.system .text {
            font-size: 12px;
        }

        .date-divider {
            text-align: center;
            font-size: 11px;
            color: #7a4a5a;
            padding: 6px 0 2px;
        }

        .date-divider span {
            background: rgba(255,255,255,0.4);
            padding: 2px 16px;
            border-radius: 20px;
        }

        @keyframes fadeUp {
            0% { opacity: 0; transform: translateY(8px); }
            100% { opacity: 1; transform: translateY(0); }
        }

        /* Поле ввода */
        .input-area {
            padding: 10px 20px 14px;
            background: rgba(255,255,255,0.3);
            backdrop-filter: blur(4px);
            border-top: 1px solid rgba(255,255,255,0.3);
            display: flex;
            gap: 8px;
            align-items: center;
            flex-shrink: 0;
        }

        .input-area input {
            flex: 1;
            padding: 10px 16px;
            border: none;
            border-radius: 28px;
            background: white;
            font-size: 15px;
            outline: 2px solid transparent;
            transition: 0.2s;
        }

        .input-area input:focus {
            outline: 2px solid #ec407a;
        }

        .input-area input:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .input-area button {
            background: linear-gradient(135deg, #d81b60, #ad1457);
            border: none;
            color: white;
            padding: 10px 18px;
            border-radius: 28px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
        }

        .input-area button:hover:not(:disabled) {
            transform: scale(1.02);
        }

        .input-area button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .input-area .sticker-btn {
            background: rgba(216,27,96,0.1);
            color: #d81b60;
            padding: 10px 12px;
            font-size: 20px;
            box-shadow: none;
        }

        .input-area .sticker-btn:hover:not(:disabled) {
            background: rgba(216,27,96,0.2);
        }

        /* Правая панель - стикеры */
        .right-panel {
            width: 220px;
            min-width: 180px;
            background: rgba(255,240,245,0.2);
            border-left: 1px solid rgba(255,255,255,0.3);
            padding: 14px;
            overflow-y: auto;
        }

        .right-panel h4 {
            font-size: 13px;
            color: #7a4a5a;
            margin-bottom: 8px;
        }

        .sticker-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 4px;
        }

        .sticker-grid .sticker {
            aspect-ratio: 1;
            background: rgba(255,255,255,0.4);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 26px;
            cursor: pointer;
            transition: 0.2s;
            border: 2px solid transparent;
        }

        .sticker-grid .sticker:hover {
            transform: scale(1.1);
            border-color: #d81b60;
            background: rgba(255,255,255,0.7);
        }

        /* Скролл */
        .messages-area::-webkit-scrollbar,
        .contact-list::-webkit-scrollbar,
        .right-panel::-webkit-scrollbar {
            width: 4px;
        }
        .messages-area::-webkit-scrollbar-thumb,
        .contact-list::-webkit-scrollbar-thumb,
        .right-panel::-webkit-scrollbar-thumb {
            background: #f06292;
            border-radius: 10px;
        }

        /* Адаптив */
        @media (max-width: 768px) {
            body { padding: 8px; }
            .app-container { height: 98vh; max-height: none; border-radius: 16px; }
            .sidebar { width: 200px; min-width: 160px; padding: 12px; }
            .right-panel { display: none; }
            .main-content { flex-direction: row; }
            .message { max-width: 90%; }
            .header h1 { font-size: 18px; }
        }

        @media (max-width: 480px) {
            .sidebar { width: 100%; min-width: auto; border-right: none; border-bottom: 1px solid rgba(255,255,255,0.3); max-height: 180px; }
            .main-content { flex-direction: column; }
            .header { padding: 10px 16px; }
            .header h1 { font-size: 16px; }
            .header-right .my-id { font-size: 11px; padding: 2px 10px; }
        }
    </style>
</head>
<body>

<div class="app-container">
    <!-- Шапка -->
    <div class="header">
        <h1><span>🍓</span> Ягодка P2P</h1>
        <div class="header-right">
            <span class="my-id">🆔 <span id="myIdDisplay">загрузка...</span></span>
            <span><span class="status-dot offline" id="statusDot"></span><span id="statusText">офлайн</span></span>
        </div>
    </div>

    <div class="main-content">
        <!-- Левая панель -->
        <div class="sidebar">
            <h3>👤 Контакты</h3>
            <div class="contact-input-area">
                <input type="text" id="friendIdInput" placeholder="Введите ID друга" />
                <button id="connectBtn">🔗</button>
            </div>

            <div class="contact-list" id="contactList">
                <div style="text-align:center;padding:20px;color:#7a4a5a;font-size:13px;">
                    Нет контактов<br>
                    Введите ID друга для подключения
                </div>
            </div>

            <button id="resetBtn" style="padding:8px;border:none;border-radius:20px;background:rgba(216,27,96,0.1);color:#d81b60;font-weight:600;cursor:pointer;font-size:13px;">
                🔄 Сбросить соединение
            </button>
        </div>

        <!-- Центр - чат -->
        <div class="chat-panel">
            <div class="chat-header">
                <span class="chat-with" id="chatWith">💬 Не выбран контакт</span>
                <span class="chat-status" id="chatStatus">Подключитесь к другу</span>
            </div>
            <div class="messages-area" id="messagesArea">
                <div style="text-align:center;padding:40px 20px;color:#7a4a5a;font-size:14px;">
                    🍓 Выберите контакт слева<br>
                    чтобы начать общение
                </div>
            </div>
            <div class="input-area">
                <button class="sticker-btn" id="stickerBtn">😊</button>
                <input type="text" id="messageInput" placeholder="Напишите сообщение..." disabled />
                <button id="sendBtn" disabled>🍒</button>
            </div>
        </div>

        <!-- Правая панель - стикеры -->
        <div class="right-panel" id="stickerPanel" style="display:none;">
            <h4>😊 Стикеры</h4>
            <div class="sticker-grid" id="stickerGrid"></div>
        </div>
    </div>
</div>

<script>
    // ============================================================
    // 🍓 Ягодка P2P - Без хостинга, через WebRTC
    // ============================================================

    // --- Стикеры ---
    const STICKERS = ['🍓', '🍒', '🫐', '🍇', '🍉', '😊', '😂', '😍', '🤩', '🥰', '❤️', '🧡', '💛', '💚', '💙', '🎉', '🎊', '✨', '🌟', '🔥'];

    // --- Состояние ---
    let currentContactId = null;
    let isConnected = false;
    let peer = null;
    let conn = null;
    let myId = null;

    // --- DOM ---
    const myIdDisplay = document.getElementById('myIdDisplay');
    const statusDot = document.getElementById('statusDot');
    const statusText = document.getElementById('statusText');
    const friendIdInput = document.getElementById('friendIdInput');
    const connectBtn = document.getElementById('connectBtn');
    const resetBtn = document.getElementById('resetBtn');
    const contactList = document.getElementById('contactList');
    const messagesArea = document.getElementById('messagesArea');
    const chatWith = document.getElementById('chatWith');
    const chatStatus = document.getElementById('chatStatus');
    const messageInput = document.getElementById('messageInput');
    const sendBtn = document.getElementById('sendBtn');
    const stickerBtn = document.getElementById('stickerBtn');
    const stickerPanel = document.getElementById('stickerPanel');
    const stickerGrid = document.getElementById('stickerGrid');

    // --- Генерация ID ---
    function generateId() {
        const names = ['паша', 'маша', 'саша', 'даша', 'миша', 'наташа', 'гриша', 'андрюша', 'катюша', 'серёжа'];
        const name = names[Math.floor(Math.random() * names.length)];
        const num = Math.random().toString(36).substring(2, 6);
        return `#yagodka-${name}`;
    }

    // --- Инициализация PeerJS ---
    function initPeer() {
        // Генерируем ID
        myId = generateId();
        myIdDisplay.textContent = myId;

        // Создаём Peer с нашим ID
        peer = new Peer(myId, {
            debug: 2
        });

        // Событие: готов
        peer.on('open', (id) => {
            console.log('🆔 Peer готов:', id);
            myIdDisplay.textContent = id;
            updateStatus('offline', 'офлайн');
        });

        // Событие: входящее соединение
        peer.on('connection', (incomingConn) => {
            console.log('📞 Входящее соединение от:', incomingConn.peer);
            setupConnection(incomingConn);
        });

        // Событие: ошибка
        peer.on('error', (err) => {
            console.error('❌ Ошибка Peer:', err);
            updateStatus('offline', 'ошибка');
        });

        // Событие: закрытие
        peer.on('close', () => {
            console.log('🔌 Peer закрыт');
            updateStatus('offline', 'офлайн');
            isConnected = false;
            conn = null;
            updateUI();
        });
    }

    // --- Настройка соединения ---
    function setupConnection(connection) {
        if (conn) {
            // Если уже есть соединение, закрываем старое
            conn.close();
        }

        conn = connection;
        currentContactId = connection.peer;
        isConnected = true;

        // Обработка входящих сообщений
        conn.on('data', (data) => {
            console.log('📩 Получено:', data);
            handleIncomingMessage(data);
        });

        // Обработка закрытия
        conn.on('close', () => {
            console.log('🔌 Соединение закрыто');
            isConnected = false;
            conn = null;
            updateStatus('offline', 'отключен');
            updateUI();
            addSystemMessage('Соединение разорвано');
        });

        // Обработка ошибок
        conn.on('error', (err) => {
            console.error('❌ Ошибка соединения:', err);
            isConnected = false;
            conn = null;
            updateStatus('offline', 'ошибка');
            updateUI();
        });

        // Отправляем приветствие
        conn.send({
            type: 'system',
            text: '👋 Привет! Я подключился к тебе!'
        });

        updateStatus('online', 'онлайн');
        updateUI();
        addSystemMessage(`✅ Подключено к ${connection.peer}`);

        // Добавляем в контакты
        addContact(connection.peer);
    }

    // --- Подключение к другу ---
    function connectToFriend(friendId) {
        if (!friendId || friendId.trim() === '') {
            alert('Введите ID друга');
            return;
        }

        friendId = friendId.trim();

        if (friendId === myId) {
            alert('❌ Нельзя подключиться к самому себе!');
            return;
        }

        if (conn) {
            conn.close();
            conn = null;
        }

        updateStatus('connecting', 'подключение...');

        try {
            const newConn = peer.connect(friendId);
            setupConnection(newConn);
        } catch (err) {
            console.error('Ошибка подключения:', err);
            updateStatus('offline', 'ошибка');
            alert('❌ Не удалось подключиться. Проверьте ID и попробуйте снова.');
        }
    }

    // --- Обработка входящих сообщений ---
    function handleIncomingMessage(data) {
        if (data.type === 'message') {
            addMessage(data.text, data.sender || data.user || 'Собеседник');
        } else if (data.type === 'sticker') {
            addSticker(data.emoji, data.sender || 'Собеседник');
        } else if (data.type === 'system') {
            addSystemMessage(data.text);
        } else {
            // Обычное сообщение
            addMessage(data.text || data, data.sender || 'Собеседник');
        }
    }

    // --- Отправка сообщения ---
    function sendMessage(text) {
        if (!conn || !isConnected) {
            alert('❌ Нет соединения с собеседником');
            return;
        }

        const message = {
            type: 'message',
            text: text,
            sender: 'Я'
        };

        conn.send(message);
        addMessage(text, 'Вы', true);
    }

    // --- Отправка стикера ---
    function sendSticker(emoji) {
        if (!conn || !isConnected) {
            alert('❌ Нет соединения с собеседником');
            return;
        }

        const message = {
            type: 'sticker',
            emoji: emoji,
            sender: 'Я'
        };

        conn.send(message);
        addSticker(emoji, 'Вы', true);
    }

    // --- Добавление сообщения в UI ---
    function addMessage(text, user, isOwn = false) {
        // Убираем пустое состояние
        const empty = messagesArea.querySelector('div[style]');
        if (empty && messagesArea.children.length === 1) {
            messagesArea.innerHTML = '';
        }

        const div = document.createElement('div');
        div.className = `message ${isOwn ? 'own' : ''}`;

        const userSpan = document.createElement('div');
        userSpan.className = 'user';
        userSpan.textContent = user;

        const timeSpan = document.createElement('span');
        timeSpan.className = 'time';
        timeSpan.textContent = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
        userSpan.appendChild(timeSpan);

        const textSpan = document.createElement('div');
        textSpan.className = 'text';
        textSpan.textContent = text;

        div.appendChild(userSpan);
        div.appendChild(textSpan);

        messagesArea.appendChild(div);
        messagesArea.scrollTop = messagesArea.scrollHeight;
    }

    function addSticker(emoji, user, isOwn = false) {
        const empty = messagesArea.querySelector('div[style]');
        if (empty && messagesArea.children.length === 1) {
            messagesArea.innerHTML = '';
        }

        const div = document.createElement('div');
        div.className = `message ${isOwn ? 'own' : ''}`;

        const userSpan = document.createElement('div');
        userSpan.className = 'user';
        userSpan.textContent = user;

        const timeSpan = document.createElement('span');
        timeSpan.className = 'time';
        timeSpan.textContent = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
        userSpan.appendChild(timeSpan);

        const stickerSpan = document.createElement('div');
        stickerSpan.className = 'sticker';
        stickerSpan.textContent = emoji;

        div.appendChild(userSpan);
        div.appendChild(stickerSpan);

        messagesArea.appendChild(div);
        messagesArea.scrollTop = messagesArea.scrollHeight;
    }

    function addSystemMessage(text) {
        const div = document.createElement('div');
        div.className = 'message system';
        div.innerHTML = `<div class="text">${text}</div>`;
        messagesArea.appendChild(div);
        messagesArea.scrollTop = messagesArea.scrollHeight;
    }

    // --- Добавление контакта в список ---
    function addContact(id) {
        const existing = contactList.querySelector(`[data-id="${id}"]`);
        if (existing) {
            // Обновляем статус
            const badge = existing.querySelector('.status-badge');
            if (badge) {
                badge.textContent = 'онлайн';
                badge.className = 'status-badge online';
            }
            return;
        }

        const div = document.createElement('div');
        div.className = 'contact-item active';
        div.dataset.id = id;

        const nameSpan = document.createElement('span');
        nameSpan.className = 'name';
        nameSpan.textContent = id;

        const statusSpan = document.createElement('span');
        statusSpan.className = 'status-badge online';
        statusSpan.textContent = 'онлайн';

        div.appendChild(nameSpan);
        div.appendChild(statusSpan);

        // Клик для выбора контакта
        div.addEventListener('click', () => {
            if (conn && isConnected) {
                currentContactId = id;
                chatWith.textContent = `💬 ${id}`;
                chatStatus.textContent = 'онлайн';
                messageInput.disabled = false;
                sendBtn.disabled = false;
                stickerBtn.disabled = false;
                messageInput.focus();
            }
        });

        contactList.innerHTML = '';
        contactList.appendChild(div);
    }

    // --- Обновление UI ---
    function updateUI() {
        if (isConnected && conn) {
            chatWith.textContent = `💬 ${conn.peer}`;
            chatStatus.textContent = 'онлайн';
            messageInput.disabled = false;
            sendBtn.disabled = false;
            stickerBtn.disabled = false;
            messageInput.focus();
        } else {
            chatWith.textContent = '💬 Не выбран контакт';
            chatStatus.textContent = 'Подключитесь к другу';
            messageInput.disabled = true;
            sendBtn.disabled = true;
            stickerBtn.disabled = true;
        }
    }

    // --- Обновление статуса ---
    function updateStatus(state, text) {
        statusDot.className = `status-dot ${state}`;
        statusText.textContent = text;
    }

    // --- Сброс ---
    function resetConnection() {
        if (conn) {
            conn.close();
            conn = null;
        }
        isConnected = false;
        currentContactId = null;
        updateStatus('offline', 'офлайн');
        updateUI();
        addSystemMessage('🔄 Соединение сброшено');

        // Очищаем контакты
        contactList.innerHTML = `
            <div style="text-align:center;padding:20px;color:#7a4a5a;font-size:13px;">
                Нет контактов<br>
                Введите ID друга для подключения
            </div>
        `;

        // Очищаем сообщения
        messagesArea.innerHTML = `
            <div style="text-align:center;padding:40px 20px;color:#7a4a5a;font-size:14px;">
                🍓 Выберите контакт слева<br>
                чтобы начать общение
            </div>
        `;
    }

    // --- Стикеры ---
    function initStickers() {
        stickerGrid.innerHTML = '';
        STICKERS.forEach(emoji => {
            const div = document.createElement('div');
            div.className = 'sticker';
            div.textContent = emoji;
            div.addEventListener('click', () => {
                if (isConnected && conn) {
                    sendSticker(emoji);
                } else {
                    alert('❌ Нет соединения с собеседником');
                }
            });
            stickerGrid.appendChild(div);
        });
    }

    // --- Обработчики ---
    connectBtn.addEventListener('click', () => {
        const id = friendIdInput.value.trim();
        if (id) {
            connectToFriend(id);
            friendIdInput.value = '';
        } else {
            alert('Введите ID друга');
        }
    });

    friendIdInput.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') {
            connectBtn.click();
        }
    });

    sendBtn.addEventListener('click', () => {
        const text = messageInput.value.trim();
        if (text && isConnected) {
            sendMessage(text);
            messageInput.value = '';
        }
    });

    messageInput.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' && !e.shiftKey) {
            e.preventDefault();
            sendBtn.click();
        }
    });

    resetBtn.addEventListener('click', resetConnection);

    stickerBtn.addEventListener('click', () => {
        if (stickerPanel.style.display === 'none') {
            stickerPanel.style.display = 'block';
            stickerBtn.textContent = '✕';
        } else {
            stickerPanel.style.display = 'none';
            stickerBtn.textContent = '😊';
        }
    });

    // --- Запуск ---
    initPeer();
    initStickers();

    console.log('🍓 Ягодка P2P готова!');
    console.log('🆔 Ваш ID:', myId);
    console.log('📌 Дайте этот ID другу для подключения');

    // Автоподключение если есть параметр в URL
    const urlParams = new URLSearchParams(window.location.search);
    const friendId = urlParams.get('connect');
    if (friendId) {
        setTimeout(() => {
            connectToFriend(friendId);
        }, 1000);
    }
</script>
</body>
</html>
